# Version-controlled in git. Mounted read-only; entrypoint copies to container.
# Runtime values (db_host, db_user, etc.) are appended by entrypoint and stay in container.
[options]
proxy_mode = True
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/private-addons
data_dir = /var/lib/odoo
# Database configuration is read from environment variables:
# HOST, USER, PASSWORD, PORT (Odoo automatically reads these)
# db_name is set via -d flag in CMD
db_filter = ^nidan$
