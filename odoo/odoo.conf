# Version-controlled in git. Mounted read-only; entrypoint copies to container.
# Runtime values (db_host, db_user, etc.) are appended by entrypoint and stay in container.
[options]
proxy_mode = True
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/private-addons,/mnt/payment-addons,/mnt/trigonal/00-vendor,/mnt/trigonal/10-core,/mnt/trigonal/20-tax-np,/mnt/trigonal/30-hr,/mnt/trigonal/40-payroll,/mnt/trigonal/50-desk,/mnt/trigonal/60-asset,/mnt/trigonal/70-finance,/mnt/trigonal/80-supply,/mnt/trigonal/90-health
# /mnt/trigonal/* are the Trigonal product tiers (OPL-1, closed source). Each tier is a
# separate addons dir so a non-hospital client can be shipped a subset -- see
# trigonal-addons/BUNDLES.md. 99-qa is deliberately absent: it is a test-only module that
# depends on every other one and is never shipped.
data_dir = /var/lib/odoo
# Database configuration is read from environment variables:
# HOST, USER, PASSWORD, PORT (Odoo automatically reads these)
# db_name is set via -d flag in CMD
db_filter = ^nidan$
list_db = False
