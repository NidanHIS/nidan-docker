# Offline security checks (backlog KC-42 / E-1). No running stack needed; every push and PR.
# Each step is a checker from scripts/ (their self-tests and tests/e2e-auth are kept out of git, 2026-10-13).

name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tooling
        run: python3 -m pip install --quiet pyyaml==6.0.3

      - name: Realm lint (KC-54-01, KC-01-03 static, KC-04-03)
        run: |
          python3 -I scripts/check-realm.py

      - name: Gateway routes match the contract proxy/routes.yaml exactly (KC-10); port 80 is redirect + ACME (KC-47-02)
        run: |
          python3 -I scripts/check-routes.py

      - name: Checkers (backup safety, ingress, publish, O3 login, role sync plan)
        run: |
          python3 -I scripts/check-backup-safety.py
          python3 -I scripts/check-ingress.py
          python3 -I scripts/check-publish.py
          python3 -I scripts/check-esm-login.py
          python3 -I keycloak/role-sync/role_sync.py --test    # role sync plan: never deletes realm-file roles

      - name: Gateway page translations have the same keys (KC-18-03)
        run: |
          python3 -I - <<'PY'
          import json, re
          for base in ("proxy/assets/i18n", "proxy/staff/i18n"):   # launcher, Staff page
              en = json.load(open(f"{base}/messages_en.json"))
              for loc in ("ne", "es", "fr", "ar"):          # proxy/assets/i18n.js SUPPORTED
                  d = json.load(open(f"{base}/messages_{loc}.json")); d.pop("_review", None)
                  assert set(en) == set(d), (base, loc, "missing", sorted(set(en) - set(d)), "extra", sorted(set(d) - set(en)))
                  assert all(str(v).strip() for v in d.values()), f"empty {base} {loc} string"
                  for k in en:                              # same {placeholders}, or a name / error goes missing
                      assert set(re.findall(r"{\w+}", en[k])) == set(re.findall(r"{\w+}", d[k])), (base, loc, k)
              print(base, len(en), "keys in every language")
          PY

      - name: Tracked demo .env holds only approved demo values (KC-05-07)
        run: |
          python3 -I scripts/check-demo-env.py

      - name: Image and ref pins, ratchet against security/unpinned.baseline (KC-46-01)
        run: |
          python3 -I scripts/check-pins.py

      - name: OpenMRS Basic-auth client inventory (KC-32-06; this repo's part, siblings are checked locally)
        run: |
          python3 -I scripts/check-openmrs-basic-clients.py

      - name: Committed artifacts match their manifest (KC-46-03)
        run: |
          python3 -I scripts/check-artifacts.py

      - name: Every compose variable and script is documented (KC-29-01)
        run: |
          python3 -I scripts/check-docs.py

      - name: Keycloak theme escaping and messages (KC-17-06, KC-17-02 copy)
        run: |
          python3 -I scripts/check-theme.py

      - name: Superset fail-closed config + central login (KC-03, KC-39)
        run: |
          python3 -I superset/tests/test_config_guards.py
          python3 -I superset/tests/test_sso.py
          python3 -I superset/tests/test_sso_wiring.py

      - name: Auth modes, paywall URLs, published ports (KC-27, KC-14-06)
        run: python3 -I scripts/nidan-auth-check.py

      - name: Production preflight refuses the public demo .env (KC-05-03)
        run: |
          python3 -I scripts/preflight.py            # demo mode: reports only
          if NIDAN_DEPLOYMENT=production python3 -I scripts/preflight.py >/dev/null 2>&1; then
            echo "preflight accepted the tracked demo .env in production mode" >&2
            exit 1
          fi
