# Central-login images (backlog KC-07-09): Keycloak >= 26.8.0, and no FIXABLE critical/high CVE in the
# Keycloak or oauth2-proxy image pinned in docker-compose.yml. Unfixed ones (no patched package exists,
# e.g. base-OS pcre2 marked affected / will_not_fix) are listed, not failed: bump the pin when a fix ships.
# Daily as well, because a new CVE appears without any change here.

name: Image scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.75.0
    steps:
      - uses: actions/checkout@v4

      - name: Images from docker-compose.yml; Keycloak >= 26.8.0
        run: |
          kc=$(grep -E '^ *image: *quay\.io/keycloak/keycloak:' docker-compose.yml | grep -oE 'quay[^ ]+' | head -n 1)
          o2p=$(grep -E '^ *image: *quay\.io/oauth2-proxy/oauth2-proxy:' docker-compose.yml | grep -oE 'quay[^ ]+' | head -n 1)
          [ -n "$kc" ] && [ -n "$o2p" ] || { echo "keycloak / oauth2-proxy image not found in docker-compose.yml" >&2; exit 1; }
          v=${kc#*:}; v=${v%%@*}
          [ "$(printf '26.8.0\n%s\n' "$v" | sort -V | head -n 1)" = "26.8.0" ] || { echo "Keycloak $v is older than 26.8.0" >&2; exit 1; }
          echo "IMAGES=$kc $o2p" >> "$GITHUB_ENV"

      - name: Install trivy (pinned, checksum-verified)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install trivy /usr/local/bin/trivy

      - name: Fail on fixable critical/high
        run: |
          for img in $IMAGES; do
            echo "== $img"
            trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img"
          done

      - name: Unfixed critical/high (report only)
        if: always()
        run: |
          for img in $IMAGES; do
            trivy image --quiet --severity CRITICAL,HIGH "$img"
          done
