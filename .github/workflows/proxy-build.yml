# Nidan reverse proxy (nginx gateway) — build & push
# Triggers when proxy/** changes.

name: Gateway (Proxy) Build & Push

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - 'proxy/**'
#  pull_request:
#    branches:
#      - dev
#      - main
#    paths:
#      - 'proxy/**'

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_BASE: bhalubang

jobs:
  build-and-deploy:
    name: Build & Push gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/gateway
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' || github.base_ref == 'dev' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: proxy
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true # push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
