  #    - traefik.http.routers.openmrs-spa-http.entrypoints=web
  #    - traefik.http.routers.openmrs-spa-http.middlewares=openmrs-redirect,openmrs-spa-strip
  #  networks:
  #    - his_core
  #  profiles: ["core"]

  

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    env_file:
      - config/env/odoo.env
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      - DB_HOST=odoo_db
      - DB_USER=${ODOO_DB_USER:-odoo}
      - DB_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons
    networks:
      - his_core
    ports:
      - "8069:8069"
    profiles: ["odoo"]

  odoo-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - POSTGRES_USER=${ODOO_DB_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - his_core
    profiles: ["odoo"]

 
  bahmni-reports:
    image: bahmni/reports:1.0.0
    restart: unless-stopped
    env_file:
      - config/env/bahmni-reports.env
    depends_on:
      db_openmrs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.reports-redirect.redirectscheme.scheme=https
      - traefik.http.routers.reports-http.rule=Host(`${BAHMNI_REPORTS_HOST}`)
      - traefik.http.routers.reports-http.entrypoints=web
      - traefik.http.routers.reports-http.middlewares=reports-redirect
      - traefik.http.routers.reports.rule=Host(`${BAHMNI_REPORTS_HOST}`)
      - traefik.http.routers.reports.entrypoints=websecure
      - traefik.http.routers.reports.tls.certresolver=letsencrypt
      - traefik.http.services.reports.loadbalancer.server.port=8080
    networks:
      - his_core
    profiles: ["reports"]

networks:
  his_core:
    driver: bridge

secrets:
  datasource.password:
    file: ./volume/properties/datasource.password  
  common.properties:
    file:  ./volume/properties/common.properties  
  hapi_application.yaml:
    file: ./volume/properties/hapi_application.yaml


volumes:

  traefik-lets-encrypt:
  openmrs-data:
  db-openmrs-data:
  odoo-db-data:
  openmrs-appdata:
  odoo-data:
  odoo-addons:
  odoo-config:
  odoo-checksums:
  odoo-filestore:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  lucene_index-vol:
  

