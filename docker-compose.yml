# Log cap for every service (backlog KC-13-04): without it a chatty container fills the host disk.
x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

networks:
  nidan-network:
    driver: bridge
  # Central login (KC-07 / KC-43): gateway, keycloak, keycloak-db, keycloak-config-cli only. Internal =
  # no route out. Fixed subnet so the gateway has a static address for KC_PROXY_TRUSTED_ADDRESSES.
  # Databases, Kafka and ZooKeeper, shared only with the services that read or write them (KC-43-03). Internal =
  # no route out; the gateway is NOT on it, so a compromised gateway cannot reach a database.
  # Check: python3 -I tests/e2e-auth/harness/net-probe.py
  data-net:
    driver: bridge
    internal: true
  # Only keycloak-admin-proxy: a non-internal network so its 127.0.0.1:8180 is served (KC-07-04).
  kc-admin-net:
    driver: bridge
  auth-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  openelis-logs:          # OpenELIS application logs (KC-45-03)
  openelis-tomcat-logs:   # Tomcat access logs, no query strings, 365 days (KC-45-02/03)
  gateway-logs:
  keycloak-db-data:
  openmrs-data:
  openmrs-db-data: # openmrs-db-postgres-data:  # commented - PostgreSQL for OpenMRS disabled for now

  odoo-data:
  odoo-db-data:
  orthanc-data:
  orthanc-db-data:
  nidan-openelis-data:
  openelis-db-data:
  openelis-lucene-index:
  openelis-properties:
  certbot-etc:
  certbot-www:
  nidan-integration-db-data:
  dhis2-integration-db-data:
  dhis2-integration-data:
  dhis2-integration-audit-logs:
  dhis2-integration-app-logs:
  superset-home:

services:
  # ============================================================================
  # PROXY / GATEWAY
  # ============================================================================
  gateway:
    logging: *default-logging
    # build: ./proxy  # local dev: docker compose build gateway
    # CI: dev → trigonaltechnology/gateway:latest | main → :stable
    image: ${GATEWAY_IMAGE:-trigonaltechnology/gateway:latest}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8069:8069"   # Odoo / POS (TLS + app-odoo gate); Odoo itself is not published
      - "9443:9443"   # Keycloak login (central login) + Staff page; serves nothing else (D1)
    environment:
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:-localhost}
      # KC-12-07: Keycloak login/token requests per client IP and minute; exempt CIDRs (comma separated) only for a
      # known shared address such as a NAT in front of the gateway (each exemption removes the limit for it)
      - KC_LOGIN_RATE_PER_MIN=${KC_LOGIN_RATE_PER_MIN:-10}
      - KC_LOGIN_RATE_EXEMPT=${KC_LOGIN_RATE_EXEMPT:-}
      # Extra names for the self-signed cert (comma separated, openssl SAN syntax)
      - GATEWAY_CERT_SANS=${GATEWAY_CERT_SANS:-}
      - OPENELIS_DOMAIN=${OPENELIS_DOMAIN}
      # OpenELIS context path (must match the backend SERVER_SERVLET_CONTEXT_PATH)
      - OPENELIS_CONTEXT_PATH=${OPENELIS_CONTEXT_PATH:-/api/OpenELIS-Global/}
      # Odoo card URL on the gateway dashboard (index.html)
      - DASHBOARD_ODOO_URL=${DASHBOARD_ODOO_URL:-https://${GATEWAY_DOMAIN:-localhost}:8069}
      # Optional Google Analytics id for the public demo launcher; unset = no third-party script.
      - GATEWAY_ANALYTICS_ID=${GATEWAY_ANALYTICS_ID:-}
      # Public demo only: show the demo-credentials card on the launcher (KC-04-01).
      - GATEWAY_SHOW_DEMO_CREDENTIALS=${GATEWAY_SHOW_DEMO_CREDENTIALS:-false}
      # IT support number shown on the outage page (KC-16).
      - SUPPORT_PHONE=${SUPPORT_PHONE:-}
      - NIDAN_BRAND_NAME=${NIDAN_BRAND_NAME:-Nidan EHR}       # page titles (launcher, outage); plain text
      - NIDAN_APP_LOGOUT_ENDS_ALL=${NIDAN_APP_LOGOUT_ENDS_ALL:-false}   # true: any app logout signs out of everything
      # Launcher "Change password" link to Keycloak (KC-55-05); empty = no link.
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}
      # With central login on, the gateway authenticates to Orthanc behind its gates (KC-30-06); unused when off.
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-nidan}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:-}
      - ORTHANC_VIEWER_PASSWORD=${ORTHANC_VIEWER_PASSWORD:-}
      # Central login: true = every app route needs a Keycloak session (needs --profile sso), KC-10.
      - NIDAN_SSO_ENABLED=${NIDAN_SSO_ENABLED:-false}
      # HSTS: auto = only a DNS name with a publicly issued certificate (KC-12-02); on/off to force
      - GATEWAY_HSTS=${GATEWAY_HSTS:-auto}
    networks:
      nidan-network:
      auth-net:
        ipv4_address: 172.31.250.10
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - gateway-logs:/var/log/nidan          # PHI-free access log, 0600, 365 days (KC-13-03)
      - ${STAFF_SITE_DIR:-./proxy/staff-site}:/etc/nginx/staff-site:ro   # scripts/staff-config.py output (KC-21-09)
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./proxy/auth:/etc/nginx/auth-templates:ro
      - ./proxy/index.html.template:/etc/nginx/templates/index.html.template:ro
      - ./proxy/nidan-logo.png:/usr/share/nginx/html/nidan-logo.png:ro
      - ./proxy/trigonal-logo.png:/usr/share/nginx/html/trigonal-logo.png:ro
      - ./proxy/502.html:/usr/share/nginx/html/502.html:ro
      # logo, colours, texts for the launcher AND the Keycloak login page (proxy/assets/brand/README.md)
      - ${NIDAN_BRANDING_DIR:-./proxy/assets/brand}:/usr/share/nginx/html/assets/brand:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8099/gateway-health" ]   # internal listener (KC-47-03)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped # Auto-restart if it fails during startup

  # # ============================================================================
  # # OPENMRS
  # # ============================================================================
  openmrs-backend:
    logging: *default-logging
    profiles: ["openmrs","nidanehr-standard"]
    build: ./openmrs
    image: trigonaltechnology/openmrs-backend:latest
    # image: openmrs-backend:local
    # user: root
    container_name: nidan-openmrs-backend
    environment:
      # Database (MySQL) - OMRS_DB_HOSTNAME/OMRS_DB_PORT used by wait-for-it.sh; OMRS_DB_URL for connection
      OMRS_DB: mysql
      OMRS_DB_HOSTNAME: openmrs-db
      OMRS_DB_PORT: "3306"
      OMRS_DB_URL: jdbc:mysql://openmrs-db:3306/${OPENMRS_DB_NAME:-openmrs}?useUnicode=true&characterEncoding=UTF-8&sessionVariables=storage_engine=InnoDB
      OMRS_DB_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:?set OPENMRS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      OMRS_DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      # Installation (MySQL creates DB via MYSQL_DATABASE; skip OpenMRS create-database step)
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_HAS_CURRENT_OPENMRS_DATABASE: "true"
      # Debug mode: attach remote debugger on port 5005 (e.g. from IDE) - disable to speed startup
      # OMRS_DEV_DEBUG_PORT: "5005"
      # Keep enough memory for the OpenMRS module set without exhausting the
      # 8 GiB Docker VM shared by the rest of the Nidan stack.
      OMRS_JAVA_MEMORY_OPTS: "${OMRS_JAVA_MEMORY_OPTS:--Xmx1536m -Xms512m -XX:MaxMetaspaceSize=512m}"
      # JVM (optional overrides)
      _JAVA_OPTIONS: "-Dcsrf.enabled=false"
      # Nidan paywall → Odoo payment-status API (read by nidancore via System.getenv;
      # no openmrs-runtime.properties edit / startup.sh patch needed).
      NIDANCORE_ODOO_URL: ${NIDANCORE_ODOO_URL:-http://odoo:8069}
      # Central login (KC-34): oauth2login + oauth2.properties only when on (startup-custom.sh)
      OPENMRS_SSO_ENABLED: ${OPENMRS_SSO_ENABLED:-${NIDAN_SSO_ENABLED:-false}}
      # nidancore at start: the stock admin / Admin123 becomes this (only while it is still Admin123; KC-05-06), and the
      # machine-caller accounts are created under these names (KC-32-05)
      OPENMRS_ADMIN_PASSWORD: ${OPENMRS_ADMIN_PASSWORD:?set OPENMRS_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      NIDAN_SYNC_USERNAME: ${NIDAN_SYNC_USERNAME:-nidan-sync}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}
      KC_OPENMRS_CLIENT_SECRET: ${KC_OPENMRS_CLIENT_SECRET:-}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      NIDANCORE_ODOO_PAYMENT_SECRET: ${NIDAN_ODOO_SECRET}
    # ports:
    #   - "5005:5005"  # Remote debug port
    networks:
      - nidan-network
      - data-net
    depends_on:
      openmrs-db:
        condition: service_healthy
    volumes:
      - openmrs-data:/openmrs/data
      # Optional dev: mount locally-built OMODs (startup.sh copies *.omod into data/modules on start).
      - ./openmrs/custom_modules:/openmrs/custom_modules:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/openmrs/" ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1200s
    restart: unless-stopped

  openmrs-frontend:
    logging: *default-logging
    # build:
    #   context: ./openmrs/frontend
    #   dockerfile: Dockerfile
    #   args:
    #     NIDAN_CALENDAR_BUNDLE: "1.0.0-v9"   # bump after repacking the tgz
    # Vanilla upstream SPA (no BS calendar): dockerfile: Dockerfile.vanilla
    profiles: ["openmrs","nidanehr-standard"]
    image: trigonaltechnology/openmrs-frontend:latest
    container_name: nidan-openmrs-frontend
    environment:
      - SPA_PATH=/openmrs/spa
      - API_URL=/openmrs
      - SPA_CONFIG_URLS=/openmrs/spa/config-core_demo.json
      # central login (KC-35): adds config-sso.json (O3 login/logout through Keycloak)
      - OPENMRS_SSO_ENABLED=${OPENMRS_SSO_ENABLED:-${NIDAN_SSO_ENABLED:-false}}

    #uncomment to mount nginx to override and allow backend-frontend communication when running without the gateway 
    # volumes:
    #   - ./openmrs/frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nidan-network
    depends_on:
      openmrs-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3

  openmrs-db:
    logging: *default-logging
    #image: mariadb:10.11
    profiles: ["openmrs","nidanehr-standard"]
    image: trigonaltechnology/openmrs-db:latest
    container_name: nidan-openmrs-db
    # Debezium/CIS: row-based binlog events for wide rows must fit max_allowed_packet (error 1236 if too small).
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin=mysql-bin --binlog_format=ROW --server-id=1 --binlog_row_image=FULL --max-allowed-packet=512M
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No host port (approved 2026-10-07): DB tools use `docker compose exec` or an SSH tunnel.
    environment:
      MYSQL_DATABASE: ${OPENMRS_DB_NAME:-openmrs}
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:?set OPENMRS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:?set OPENMRS_DB_ROOT_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)

  # PostgreSQL for OpenMRS - commented out for now
  # openmrs-db-postgres:
  #   image: postgres:15-alpine
  #   container_name: nidan-openmrs-db-postgres
  #   profiles:
  #     - openmrs-postgres
  #   command: >
  #     postgres -c wal_level=logical -c max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-1GB}
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U ${OPENMRS_DB_USER:-openmrs} -d ${OPENMRS_DB_NAME:-openmrs}" ]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     POSTGRES_DB: ${OPENMRS_DB_NAME:-openmrs}
  #     POSTGRES_USER: ${OPENMRS_DB_USER:-openmrs}
  #     POSTGRES_PASSWORD: ${OPENMRS_DB_PASSWORD:?set OPENMRS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
  #   volumes:
  #     - openmrs-db-postgres-data:/var/lib/postgresql/data
  #     - ./openmrs/db/init-openmrs-db.sql:/docker-entrypoint-initdb.d/init-openmrs-db.sql:ro
  #   networks:
  #     - nidan-network

  # ============================================================================
  # ODOO
  # ============================================================================
  odoo:
    logging: *default-logging
    # Open-source base by default; hospitals set ODOO_IMAGE to the private image
    # (e.g. trigonaltechnology/nidan_odoo_pro:stable) which bakes the closed-source
    # addons into /mnt/private-addons. No host addon source is mounted in prod.
    # image: ${ODOO_IMAGE:-trigonaltechnology/nidan_odoo:stable}
    profiles: ["odoo","nidanehr-standard"]
    image: trigonaltechnology/nidan_odoo:latest
    container_name: nidan-odoo
    command: ["odoo", "-d", "${ODOO_DB_NAME:-nidan}", "--proxy-mode", "--dev=xml", "-u", "all"]
    # Not published: people reach Odoo through the gateway's https://<host>:8069 (app-odoo gate, KC-53-02);
    # services call odoo:8069 inside the network.
    environment:
      # Odoo reads these environment variables automatically
      - HOST=${ODOO_DB_HOST}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - PORT=${ODOO_DB_PORT}
      - ODOO_DB_NAME=${ODOO_DB_NAME}
      - ODOO_ADMIN_EMAIL=${ODOO_ADMIN_EMAIL:-nidan}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD:?set ODOO_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      # PostgreSQL superuser for database creation
      - POSTGRES_USER=${ODOO_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ODOO_POSTGRES_PASSWORD}
      # Nidan OIS connector
      - NIDAN_OIS_URL=${NIDAN_OIS_URL}
      # Central login (nidan_keycloak_sso, KC-37): provider record is synced from these at module install/upgrade.
      # Browser login goes to the public URL; token and keys via the gateway's internal back-channel (KC-43).
      - NIDAN_SSO_ENABLED=${NIDAN_SSO_ENABLED:-false}
      - NIDAN_KEYCLOAK_CLIENT_ID=odoo
      - NIDAN_KEYCLOAK_CLIENT_SECRET=${KC_ODOO_CLIENT_SECRET:-}
      - NIDAN_KEYCLOAK_AUTH_URL=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan/protocol/openid-connect/auth
      - NIDAN_KEYCLOAK_TOKEN_URL=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/token
      - NIDAN_KEYCLOAK_JWKS_URL=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/certs
      - NIDAN_OIS_SECRET=${NIDAN_OIS_SECRET}
      - NIDAN_ODOO_SECRET=${NIDAN_ODOO_SECRET}
      - NIDAN_DEPLOYMENT=${NIDAN_DEPLOYMENT:-}   # production: Odoo refuses short/demo shared secrets (KC-51-04)
      # Odoo -> OpenMRS auth (KC-33): basic (Settings credentials) until OpenMRS SSO is on, then jwt
      # with the realm's odoo-sync client. The secret is env-only, never an Odoo config parameter.
      - OPENMRS_AUTH_MODE=${OPENMRS_AUTH_MODE:-basic}
      - OPENMRS_AUTH_TOKEN_URL=${OPENMRS_AUTH_TOKEN_URL:-http://gateway:8099/auth/realms/nidan/protocol/openid-connect/token}
      - OPENMRS_AUTH_CLIENT_ID=odoo-sync
      - OPENMRS_AUTH_CLIENT_SECRET=${KC_ODOO_SYNC_CLIENT_SECRET:-}
      # New Config Variables
      - ODOO_WEB_BASE_URL=${ODOO_WEB_BASE_URL:-https://${GATEWAY_DOMAIN:-localhost}:8069}
      - ODOO_WEB_BASE_URL_FREEZE=${ODOO_WEB_BASE_URL_FREEZE:-True}
      - ODOO_DB_FILTER=^${ODOO_DB_NAME:-nidan}$
    volumes:
      - odoo-data:/var/lib/odoo
      # Addons come from the image (baked at /mnt/extra-addons + /mnt/private-addons).
      # No host addon source should be mounted in prod.
      # - ${ODOO_ADDONS_PATH:-../odoo_19_addons}:/mnt/extra-addons
      # Mount the private/closed-source addons for live editing in dev
      # - ${ODOO_PRIVATE_ADDONS_HOST_PATH:-../nidan_odoo_extra_addons}:/mnt/private-addons
      # odoo.conf from git (read-only). Entrypoint copies to container; runtime changes stay in container.
      - ./odoo/odoo.conf:/mnt/odoo.conf.template:ro
    networks:
      - nidan-network
      - data-net
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8069/web/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  odoo-db:
    logging: *default-logging
    profiles: ["odoo","nidanehr-standard"]
    image: postgres:15
    container_name: nidan-odoo-db
    environment:
      POSTGRES_DB: ${ODOO_POSTGRES_DB}
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      POSTGRES_USER: ${ODOO_POSTGRES_USER}
      # Pass Odoo DB config to init script
      ODOO_DB_NAME: ${ODOO_DB_NAME}
      ODOO_DB_USER: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - ./odoo/db/init-odoo-db.sh:/docker-entrypoint-initdb.d/init-odoo-db.sh:ro
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ODOO_POSTGRES_USER:-odoo} -d ${ODOO_POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORTHANC
  # ============================================================================
  orthanc:
    logging: *default-logging
    profiles: ["orthanc","nidanehr-standard"]
    image: orthancteam/orthanc:26.6.0
    container_name: nidan-orthanc
    ports:
      - "${DICOM_BIND_IP:-0.0.0.0}:4242:4242" # DICOM; set DICOM_BIND_IP to the modality-LAN address (KC-31-02)
    environment:
      # DICOM lockdown (KC-31): only registered modalities (JSON, see env.template) may store / find / move.
      # ORTHANC_DICOM_ALLOW_ANY_STORE=true keeps today's open store until the site's modalities are listed;
      # preflight refuses production while it is true or no modality is registered.
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "${ORTHANC_DICOM_ALLOW_ANY_STORE:-true}"
      ORTHANC__DICOM_CHECK_MODALITY_HOST: "true"
      ORTHANC__DICOM_MODALITIES: '${ORTHANC_DICOM_MODALITIES:-{}}'
      # Enable plugins
      DICOM_WEB_PLUGIN_ENABLED: "true"
      WORKLISTS_PLUGIN_ENABLED: "true"
      POSTGRESQL_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC_EXPLORER_2_ENABLED: "true"
      WEBHOOKS_PLUGIN_ENABLED: "true"
      # Set to false in production
      VERBOSE_STARTUP: "true"
      # PostgreSQL database (dynamic/secrets)
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      # Set to false to store actual DICOM files on the filesystem instead of the database
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__POSTGRESQL__HOST: "${ORTHANC_DB_HOST:-orthanc-db}"
      ORTHANC__POSTGRESQL__PORT: "5432"
      ORTHANC__POSTGRESQL__DATABASE: "${ORTHANC_DB_NAME:-orthanc}"
      # own non-superuser login once scripts/app-db-roles.py has run (ORTHANC_DB_APP_*); the superuser otherwise
      ORTHANC__POSTGRESQL__USERNAME: "${ORTHANC_DB_APP_USER:-${ORTHANC_DB_USER:-orthanc}}"
      ORTHANC__POSTGRESQL__PASSWORD: "${ORTHANC_DB_APP_PASSWORD:-${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD (generate-secrets.sh writes .env.local)}}"
      # Authentication (dynamic/secrets)
      # admin (CIS, the Orthanc UI for orthanc-admin) + read-only viewer (image viewer routes; orthanc/viewer-readonly.lua)
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-nidan}": "${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD (generate-secrets.sh writes .env.local)}", "nidan-viewer": "${ORTHANC_VIEWER_PASSWORD:?set ORTHANC_VIEWER_PASSWORD (generate-secrets.sh writes .env.local)}"}
      ORTHANC_VIEWER_USERNAME: nidan-viewer
      # Exposed for healthchecks / operators (Orthanc reads ORTHANC__* for config)
      ORTHANC_USERNAME: "${ORTHANC_USERNAME:-nidan}"
      ORTHANC_PASSWORD: "${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD (generate-secrets.sh writes .env.local)}"
      # Dynamic Webhook to CIS
      ORTHANC_WEBHOOK_URL: "http://${CIS_HOST:-nidan-cis}:${CIS_PORT:-8081}/orthanc/webhook"
      # Sent by webhook.lua; CIS refuses the webhook when it is unset or wrong.
      ORTHANC_WEBHOOK_SECRET: "${ORTHANC_WEBHOOK_SECRET:-}"
    networks:
      - nidan-network
      - data-net
    depends_on:
      - orthanc-db
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      # Static configuration file
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/webhook.lua:/etc/orthanc/webhook.lua:ro
      - ./orthanc/viewer-readonly.lua:/etc/orthanc/viewer-readonly.lua:ro   # viewer reads only, no execute-script (KC-30-02/05)
      # Worklist directory for MWL plugin
      - ./orthanc/worklists:/var/lib/orthanc/worklists
      # DICOM File Storage (use a named volume or change to a host path like /mnt/dicom:/var/lib/orthanc/db)
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      # TCP-only check: "healthy" means port listens, not that the UI loaded (UI needs HTTP Basic auth).
      test: [ "CMD", "python3", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect(('127.0.0.1', 8042))" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  orthanc-db:
    logging: *default-logging
    profiles: ["orthanc","nidanehr-standard"]
    image: postgres:15
    container_name: nidan-orthanc-db
    environment:
      POSTGRES_DB: ${ORTHANC_DB_NAME}
      POSTGRES_USER: ${ORTHANC_DB_USER}
      POSTGRES_PASSWORD: ${ORTHANC_DB_PASSWORD}
    volumes:
      - orthanc-db-data:/var/lib/postgresql/data
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)

  # ============================================================================
  # OPENELIS (Placeholder)
  # ============================================================================
  nidan-certbot:
    logging: *default-logging
    image: certbot/certbot:latest
    container_name: nidan-certbot
    entrypoint: "/bin/sh -c 'trap \"exit 0\" TERM; while :; do certbot renew --webroot -w /var/www/certbot --agree-tos --noninteractive --keep-until-expiring; sleep 12h & wait $${!}; done;'"
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - nidan-network

  openelis-db:
    logging: *default-logging
    image: trigonaltechnology/openelis-global-2-database:latest
    container_name: nidan-openelis-db
    platform: linux/amd64
    # No host port (approved 2026-10-07): DB tools use `docker compose exec` or an SSH tunnel.
    environment:
      POSTGRES_DB: ${OPENELIS_DB_NAME:-clinlims}
      POSTGRES_USER: postgres
      # Superuser and app user (clinlims) have separate passwords (KC-48-02). Postgres applies these only when the
      # volume is first created: an existing site changes it with ALTER ROLE postgres (docs/RUNBOOK-central-login-cutover.md).
      POSTGRES_PASSWORD: ${OPENELIS_DB_ROOT_PASSWORD:?set OPENELIS_DB_ROOT_PASSWORD (generate-secrets.sh writes .env.local)}
      DB_PASSWORD: ${OPENELIS_DB_PASSWORD:?set OPENELIS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      DB_SUPERUSER_PASSWORD: ${OPENELIS_DB_ROOT_PASSWORD:?set OPENELIS_DB_ROOT_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${OPENELIS_DB_USER:-postgres} -d ${OPENELIS_DB_NAME:-clinlims}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenELIS backend (Tomcat) - FIXED with HTTP enabled
  openelis:
    logging: *default-logging
    profiles: ["openelis","nidanehr-standard"]
    image: trigonaltechnology/openelis-global-2:latest
    platform: linux/amd64
    container_name: nidan-openelis
    # no published port: reached through the gateway only (KC-02)
    depends_on:
      openelis-db:
        condition: service_healthy
    environment:
      - DEFAULT_PW=${OPENELIS_DEFAULT_ADMIN_PASSWORD:?set OPENELIS_DEFAULT_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      - TZ=${OPENELIS_TZ:-UTC}
      # JVM system properties injected into Tomcat via CATALINA_OPTS.
      # Each -D flag maps 1:1 to a property key in common.properties.
      # Groups: database | middleware sync | nidan test order | nidan paywall | nidan cis retry
      # datasource.password stays a -D flag: Tomcat substitutes it into context.xml from system properties
      # (KC-45-01 residual: needs logArgs=false in the image's server.xml or Tomcat's EnvironmentPropertySource).
      - CATALINA_OPTS=
          -Ddatasource.url=jdbc:postgresql://openelis-db:5432/clinlims
          -Ddatasource.username=clinlims
          -Ddatasource.password=${OPENELIS_DB_PASSWORD:?set OPENELIS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
          -Dorg.openelisglobal.middleware.test.sync.enabled=${OPENELIS_MIDDLEWARE_TEST_SYNC_ENABLED:-false}
          -Dorg.openelisglobal.middleware.test.sync.url=${CIS_BASE_URL:-http://nidan-cis:8081}/openelis/catalog/lab-test-definition
          -Dorg.openelisglobal.middleware.result.sync.enabled=${OPENELIS_MIDDLEWARE_RESULT_SYNC_ENABLED:-true}
          -Dorg.openelisglobal.middleware.result.sync.url=${CIS_BASE_URL:-http://nidan-cis:8081}/openelis/lab-result
          -Dorg.openelisglobal.nidan.testorder.enabled=${OPENELIS_NIDAN_TESTORDER_ENABLED:-true}
          -Dorg.openelisglobal.nidan.testorder.url=${CIS_BASE_URL:-http://nidan-cis:8081}/openelis/sample-collected
          -Dorg.openelisglobal.nidan.paywall.enabled=${OPENELIS_NIDAN_PAYWALL_ENABLED:-true}
          -Dorg.openelisglobal.nidan.paywall.odoo.url=${NIDANCORE_ODOO_URL:-http://odoo:8069}
          -Dorg.openelisglobal.nidan.paywall.insurance.bypass=${OPENELIS_NIDAN_PAYWALL_INSURANCE_BYPASS:-true}
          -Dorg.openelisglobal.nidan.cisretry.list.url=${CIS_BASE_URL:-http://nidan-cis:8081}/api/dead-letters
          -Dorg.openelisglobal.nidan.cisretry.retry.url=${CIS_BASE_URL:-http://nidan-cis:8081}/api/dead-letters/retry
          -Dorg.itech.login.oauth=${OPENELIS_SSO_ENABLED:-${NIDAN_SSO_ENABLED:-false}}
          -Dorg.itech.login.oauth.config=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan
          -Dorg.itech.login.oauth.clientID=openelis
          -Dorg.itech.login.oauth.authorizationUri=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan/protocol/openid-connect/auth
          -Dorg.itech.login.oauth.tokenUri=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/token
          -Dorg.itech.login.oauth.jwkSetUri=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/certs
          -Dorg.itech.login.oauth.userInfoUri=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/userinfo
          -Dorg.itech.login.oauth.issuerUri=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan
          -Dorg.itech.login.oauth.redirectUri=https://${GATEWAY_DOMAIN:-localhost}/api/OpenELIS-Global/login/oauth2/code/nidan-keycloak
          -Dorg.itech.login.oauth.successUrl=https://${GATEWAY_DOMAIN:-localhost}/openelis/
          -Dorg.itech.login.oauth.loginpage=false
      # Secrets as env vars, not -D flags: Tomcat logs every JVM argument at start (KC-45-01). Spring maps
      # ORG_X_Y to org.x.y (pinned by OpenELIS NidanSecretEnvBindingTest).
      - ORG_OPENELISGLOBAL_MIDDLEWARE_TEST_SYNC_SECRET=${OPENELIS_MIDDLEWARE_SYNC_SECRET:?set OPENELIS_MIDDLEWARE_SYNC_SECRET (generate-secrets.sh writes .env.local)}
      - ORG_OPENELISGLOBAL_MIDDLEWARE_RESULT_SYNC_SECRET=${OPENELIS_MIDDLEWARE_SYNC_SECRET:?set OPENELIS_MIDDLEWARE_SYNC_SECRET (generate-secrets.sh writes .env.local)}
      - ORG_OPENELISGLOBAL_NIDAN_PAYWALL_ODOO_SECRET=${NIDAN_ODOO_SECRET}
      - ORG_ITECH_LOGIN_OAUTH_CLIENTSECRET=${KC_OPENELIS_CLIENT_SECRET:-}
      # Disable Odoo integration
      - ODOO_ENABLED=false
      - ORG_OPENELISGLOBAL_ODOO_ENABLED=false
      - OPENELIS_ENABLE_HTTPS=false
    networks:
      - nidan-network
      - data-net
    volumes:
      # IMPORTANT: Mount the fixed server.xml that enables HTTP on port 8080
      - ./openelis/tomcat/server.xml:/usr/local/tomcat/conf/server.xml:ro
      - openelis-properties:/var/lib/openelis-global/properties
      - ./openelis/volume/configuration:/var/lib/openelis-global/configuration
      - ./openelis/volume/branding:/var/lib/openelis-global/branding
      - ./openelis/volume/plugins:/var/lib/openelis-global/plugins
      - ./openelis/volume/ocl:/var/lib/openelis-global/ocl
      # logs on named volumes, outside the repository (KC-45-03); they can carry patient details
      - openelis-logs:/var/lib/openelis-global/logs
      - openelis-tomcat-logs:/usr/local/tomcat/logs
      - ./openelis/volume/analyzer:/var/lib/openelis-global/analyzer
      - ./openelis/volume/odoo:/var/lib/openelis-global/odoo
      - openelis-lucene-index:/var/lib/lucene_index
      - ./openelis/volume/properties/common.properties:/run/secrets/common.properties:ro
      - ./openelis/volume/certs:/etc/openelis-global:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/OpenELIS-Global/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # OpenELIS Frontend
  openelis-frontend:
    logging: *default-logging
    profiles: ["openelis","nidanehr-standard"]
    image: trigonaltechnology/openelis-global-2-frontend:latest
    container_name: nidan-openelis-frontend
    platform: linux/amd64
    # no published port: reached through the gateway only (KC-02)
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PUBLIC_URL=/openelis
      - REACT_APP_BASE_PATH=/openelis
      - REACT_APP_SERVER_BASE=/api/OpenELIS-Global # This tells frontend where backend is
    networks:
      - nidan-network

  # ============================================================================
  # NIDAN INTEGRATION MIDDLEWARE (Kafka + Postgres + CIS/OIS)
  # ============================================================================
  nidan-integration-db:
    logging: *default-logging
    profiles: ["middleware","nidanehr-standard"]
    image: postgres:15
    container_name: nidan-integration-db
    environment:
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-nidan_integration}
      POSTGRES_USER: ${INTEGRATION_DB_USER:-nidan}
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set INTEGRATION_DB_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - nidan-integration-db-data:/var/lib/postgresql/data
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INTEGRATION_DB_USER:-nidan} -d ${INTEGRATION_DB_NAME:-nidan_integration}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka (Confluent images)
  nidan-zookeeper:
    logging: *default-logging
    profiles: ["middleware","nidanehr-standard"]
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nidan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
      ZOOKEEPER_HEAP_OPTS: ${ZOOKEEPER_HEAP_OPTS:--Xmx256m -Xms256m}
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD", "cub", "zk-ready", "localhost:2181", "10" ]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  nidan-kafka:
    logging: *default-logging
    profiles: ["middleware","nidanehr-standard"]
    image: confluentinc/cp-kafka:7.5.0
    container_name: nidan-kafka
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: "${KAFKA_ZOOKEEPER_CONNECT:-nidan-zookeeper:2181}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_PORT:-9092}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://nidan-kafka:${KAFKA_PORT:-9092}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      # Dev/single-broker: more heap + I/O threads reduce GC stalls and broker timeouts under many consumers.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx768m -Xms768m}
      KAFKA_JVM_PERFORMANCE_OPTS: ${KAFKA_JVM_PERFORMANCE_OPTS:--XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExitOnOutOfMemoryError}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-3000}
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS:-8}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS:-8}
      KAFKA_SOCKET_SEND_BUFFER_BYTES: ${KAFKA_SOCKET_SEND_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: ${KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_REQUEST_MAX_BYTES: ${KAFKA_SOCKET_REQUEST_MAX_BYTES:-104857600}
      KAFKA_REPLICA_SOCKET_TIMEOUT_MS: ${KAFKA_REPLICA_SOCKET_TIMEOUT_MS:-60000}
      KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS: ${KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS:-60000}
    depends_on:
      nidan-zookeeper:
        condition: service_healthy
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_PORT:-9092} >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  nidan-cis:
    logging: *default-logging
    profiles: ["middleware","nidanehr-standard"]
    image: ${NIDAN_CIS_IMAGE:-nidan-cis:local}
    container_name: nidan-cis
    # no published port: reached through the gateway only (KC-02)
    # Share MWL directory with Orthanc (same host path as orthanc service worklists volume)
    volumes:
      # Must match Orthanc container worklist path (see orthanc service volume)
      - ./orthanc/worklists:/var/lib/orthanc/worklists

    # To call an EXTERNAL HTTPS OpenELIS :
    # 1) Map the ELIS hostname to your ELIS IP
    # extra_hosts:
    #   - "elis.openelis-global.org:192.168.1.74"
    # 2) Mount a truststore built from the ELIS TLS certificate
    # volumes:
    #   - ./openelis-truststore.p12:/etc/ssl/certs/openelis-truststore.p12:ro
    environment:
      # Database
      - INTEGRATION_DB_URL=jdbc:postgresql://${INTEGRATION_DB_HOST:-nidan-integration-db}:${INTEGRATION_DB_PORT:-5432}/${INTEGRATION_DB_NAME:-nidan_integration}
      # own non-superuser login once scripts/app-db-roles.py has run (INTEGRATION_DB_APP_*); the superuser otherwise
      - INTEGRATION_DB_USER=${INTEGRATION_DB_APP_USER:-${INTEGRATION_DB_USER:-nidan}}
      - INTEGRATION_DB_PASSWORD=${INTEGRATION_DB_APP_PASSWORD:-${INTEGRATION_DB_PASSWORD:?set INTEGRATION_DB_PASSWORD (generate-secrets.sh writes .env.local)}}
      # Secret OpenELIS sends on its result/sample/patient/test webhooks (same value OpenELIS gets).
      # Unset = CIS refuses every OpenELIS webhook; NIDAN_DEPLOYMENT=production also refuses demo values.
      - OPENELIS_CATALOG_WEBHOOK_SECRET=${OPENELIS_MIDDLEWARE_SYNC_SECRET:-}
      - ORTHANC_WEBHOOK_SECRET=${ORTHANC_WEBHOOK_SECRET:-}
      # CIS -> OpenMRS auth (KC-32-01): basic until OpenMRS SSO is on, then jwt with the realm's cis client.
      - OPENMRS_AUTH_MODE=${OPENMRS_AUTH_MODE:-basic}
      - OPENMRS_AUTH_TOKEN_URL=${OPENMRS_AUTH_TOKEN_URL:-http://gateway:8099/auth/realms/nidan/protocol/openid-connect/token}
      - OPENMRS_AUTH_CLIENT_ID=cis
      - OPENMRS_AUTH_CLIENT_SECRET=${KC_CIS_CLIENT_SECRET:-}
      # Dead-letter UI/API login (HTTP Basic) until the gateway's cis-admin SSO gate (KC-10). Unset = refused.
      - DEAD_LETTER_ADMIN_USERNAME=${DEAD_LETTER_ADMIN_USERNAME:-dead-letter-admin}
      - DEAD_LETTER_ADMIN_PASSWORD=${DEAD_LETTER_ADMIN_PASSWORD:-}
      - NIDAN_DEPLOYMENT=${NIDAN_DEPLOYMENT:-}
      # Actuator: omit Redis health when broker absent (see MANAGEMENT_HEALTH_REDIS_ENABLED in .env)
      - MANAGEMENT_HEALTH_REDIS_ENABLED=${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
      #OpenMRS database (used by Debezium)
      - OPENMRS_DB_HOST=${OPENMRS_DB_HOST:-openmrs-db}
      # OpenMRS DB reads (order context) and the StudyInstanceUID write: the OpenMRS app login, not root and not the
      # Debezium binlog login (that one is used only with DEBEZIUM_ENABLED=true)
      - OPENMRS_DB_USER=${OPENMRS_DB_USER:-openmrs}
      - OPENMRS_DB_PASSWORD=${OPENMRS_DB_PASSWORD:?set OPENMRS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      - OPENMRS_DB_PORT=${OPENMRS_DB_PORT:-3306}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=nidan-kafka:${KAFKA_PORT:-9092}
      - CIS_KAFKA_GROUP_ID=${CIS_KAFKA_GROUP_ID:-nidan-cis}
      # Client timeouts / backoff (Spring application.yml — override via .env if needed)
      - KAFKA_CONSUMER_REQUEST_TIMEOUT_MS=${KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:-45000}
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS=${KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:-15000}
      - KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS=${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:-600000}
      - KAFKA_CONSUMER_FETCH_MAX_WAIT_MS=${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:-500}
      - KAFKA_PRODUCER_REQUEST_TIMEOUT_MS=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-180000}
      - KAFKA_PRODUCER_LINGER_MS=${KAFKA_PRODUCER_LINGER_MS:-5}
      - KAFKA_METADATA_MAX_AGE_MS=${KAFKA_METADATA_MAX_AGE_MS:-300000}
      - KAFKA_RECONNECT_BACKOFF_MS=${KAFKA_RECONNECT_BACKOFF_MS:-500}
      - KAFKA_RECONNECT_BACKOFF_MAX_MS=${KAFKA_RECONNECT_BACKOFF_MAX_MS:-10000}
      # OpenMRS
      - OPENMRS_ENABLED=${OPENMRS_ENABLED:-true}
      - OPENMRS_BASE_URL=${OPENMRS_BASE_URL:-http://openmrs-backend:8080/openmrs}
      - OPENMRS_USERNAME=${OPENMRS_USERNAME:-admin}
      - OPENMRS_PASSWORD=${OPENMRS_PASSWORD:?set OPENMRS_PASSWORD (generate-secrets.sh writes .env.local)}
      # Sync-account provisioning (CIS creates the account in OpenMRS + OpenELIS on startup).
      # NIDAN_SYNC_* = the account CIS authenticates as; OPENMRS_ADMIN_* = real admin used only to create it.
      - NIDAN_SYNC_USERNAME=${NIDAN_SYNC_USERNAME:-nidan-sync}
      - NIDAN_SYNC_PASSWORD=${NIDAN_SYNC_PASSWORD:-}
      - OPENMRS_ADMIN_USERNAME=${OPENMRS_ADMIN_USERNAME:-admin}
      - OPENMRS_ADMIN_PASSWORD=${OPENMRS_ADMIN_PASSWORD:?set OPENMRS_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      - OPENMRS_IDENTIFIER_TYPE_UUID=${OPENMRS_IDENTIFIER_TYPE_UUID:-05a29f94-c0ed-11e2-94be-8c13b969e334}
      - OPENMRS_DEFAULT_LOCATION_UUID=${OPENMRS_DEFAULT_LOCATION_UUID:-44c3efb0-2583-4c80-a79e-1f756a03c0a1}
      # Encounter type for order-less (Odoo-billed / walk-in) lab results ingested from OpenELIS
      - OPENMRS_LAB_RESULTS_ENCOUNTER_TYPE_UUID=${OPENMRS_LAB_RESULTS_ENCOUNTER_TYPE_UUID:-3596fafb-6f6f-4396-8c87-6e63a0f1bd71}
      # Concept set whose members are orderable lab tests in O3; catalog sync adds new tests to it
      - OPENMRS_LAB_ORDERABLES_CONCEPT_SET_UUID=${OPENMRS_LAB_ORDERABLES_CONCEPT_SET_UUID:-1748a953-d12e-4be1-914c-f6b096c6cdef}
      - OPENMRS_FHIR_EXTENSION_URL=${OPENMRS_FHIR_EXTENSION_URL:-http://fhir.openmrs.org/ext/patient/identifier#location}
      # Orthanc
      - ORTHANC_ENABLED=${ORTHANC_ENABLED:-true}
      - ORTHANC_BASE_URL=${ORTHANC_BASE_URL:-http://orthanc:8042}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-orthanc}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD (generate-secrets.sh writes .env.local)}
      - ORTHANC_DICOM_UID_ROOT=${ORTHANC_DICOM_UID_ROOT:-1.2.840.10008}
      - ORTHANC_WORKLIST_DIR=${ORTHANC_WORKLIST_DIR:-/var/lib/orthanc/worklists}
      - DICOM_TYPE=${DICOM_TYPE:-orthanc}
      # Order type UUIDs (Initializer ordertypes.csv); CIS resolves to order_type_id at startup
      - OPENMRS_ORDER_TYPE_UUID_DRUG=${OPENMRS_ORDER_TYPE_UUID_DRUG:-131168f4-15f5-102d-96e4-000c29c2a5d7}
      - OPENMRS_ORDER_TYPE_UUID_LAB=${OPENMRS_ORDER_TYPE_UUID_LAB:-52a447d3-a64a-11e3-9aeb-50e549534c5e}
      - OPENMRS_ORDER_TYPE_UUID_RADIOLOGY=${OPENMRS_ORDER_TYPE_UUID_RADIOLOGY:-c19c8e82-8b8d-4b4e-b1ff-3f09890b2db3}
      - OPENMRS_ORDER_TYPE_UUID_PROCEDURE=${OPENMRS_ORDER_TYPE_UUID_PROCEDURE:-4237a01f-29c5-4167-9d8e-96d6e590aa33}
      - OPENMRS_ORDER_TYPE_UUID_MEDICAL_SUPPLY=${OPENMRS_ORDER_TYPE_UUID_MEDICAL_SUPPLY:-dab3ab30-2feb-48ec-b4af-8332a0831b49}
      - OPENMRS_ORDER_TYPE_UUID_BED=${OPENMRS_ORDER_TYPE_UUID_BED:-}
      # OpenELIS
      - OPENELIS_ENABLED=${OPENELIS_ENABLED:-false}
      - OPENELIS_BASE_URL=${OPENELIS_BASE_URL:-http://openelis:8080/OpenELIS-Global/rest}
      #Uncomment the fhir base url and order bundle path for lab order sync to openelis 
      # - OPENELIS_FHIR_BASE_URL=${OPENELIS_FHIR_BASE_URL:-http://openelis-fhir:8080}
      # - OPENELIS_ORDER_BUNDLE_PATH=${OPENELIS_ORDER_BUNDLE_PATH:-/fhir/tasks}
      - OPENELIS_USERNAME=${OPENELIS_USERNAME:-admin}
      - OPENELIS_PASSWORD=${OPENELIS_PASSWORD:?set OPENELIS_PASSWORD (generate-secrets.sh writes .env.local)}
      # OpenELIS DB — CIS seeds the sync account directly (OpenELIS has no user REST API)
      - OPENELIS_DB_HOST=${OPENELIS_DB_HOST:-nidan-openelis-db}
      - OPENELIS_DB_PORT=${OPENELIS_DB_PORT:-5432}
      - OPENELIS_DB_NAME=${OPENELIS_DB_NAME:-clinlims}
      - OPENELIS_DB_USER=${OPENELIS_DB_USER:-clinlims}
      - OPENELIS_DB_PASSWORD=${OPENELIS_DB_PASSWORD:?set OPENELIS_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      #- "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/etc/ssl/certs/openelis-truststore.p12 -Djavax.net.ssl.trustStorePassword=openelisTrust123"
      # Integration
      - INTEGRATION_SOURCE_SYSTEM=${INTEGRATION_SOURCE_SYSTEM:-CIS}
      - INTEGRATION_SKIP_SOURCE_SYSTEMS=${INTEGRATION_SKIP_SOURCE_SYSTEMS:-OPENMRS}
      - RADIOLOGY_ACCESSION_PREFIX=${RADIOLOGY_ACCESSION_PREFIX:-RAD-}
      - RADIOLOGY_PROCEDURE_CODE_PREFIX=${RADIOLOGY_PROCEDURE_CODE_PREFIX:-RAD-}
      # Per-flow toggles (integration.flows.* — see nidan-docker/env.template)
      - INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED:-true}
      - INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_OPENELIS_ENABLED=${INTEGRATION_FLOW_LAB_OPENELIS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_POS_ENABLED=${INTEGRATION_FLOW_LAB_POS_ENABLED:-true}
      # OpenELIS → OpenMRS result ingestion. Set to false for lab+billing-only deployments
      # (no OpenMRS); defaults to OPENMRS_ENABLED so it auto-disables when OpenMRS is absent.
      - INTEGRATION_FLOW_LAB_RESULTS_OPENMRS_ENABLED=${INTEGRATION_FLOW_LAB_RESULTS_OPENMRS_ENABLED:-${OPENMRS_ENABLED:-true}}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED:-true}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED:-true}
      # Debezium Embedded (CIS)--var control for debezium
      - DEBEZIUM_ENABLED=${DEBEZIUM_ENABLED:-false}
      # No fallback. These used to default to root/root, so an operator who
      # never set them got a root login against the clinical database and
      # nothing said so. Unset now reaches the entrypoint guard, which refuses.
      - DEBEZIUM_DB_USER=${DEBEZIUM_DB_USER:-debezium}
      - DEBEZIUM_DB_PASSWORD=${DEBEZIUM_DB_PASSWORD:-}
      - DEBEZIUM_TABLE_INCLUDE_LIST=${DEBEZIUM_TABLE_INCLUDE_LIST:-openmrs.orders,openmrs.drug_order,openmrs.person,openmrs.person_name,openmrs.patient_identifier,openmrs.bed_type,openmrs.bed_patient_assignment_map,openmrs.location,openmrs.provider,openmrs.provider_attribute}
      # Kafka retry topics (opt-in via @KafkaRetryable)
      # KC-32-03: CIS needs Keycloak for every OpenMRS call (central login); retry, so a Keycloak restart does not
      # dead-letter events. 8 attempts = about 10 minutes of backoff before the dead-letter topic.
      - INTEGRATION_KAFKA_RETRY_ENABLED=${INTEGRATION_KAFKA_RETRY_ENABLED:-true}
      - INTEGRATION_KAFKA_RETRY_ATTEMPTS=${CIS_INTEGRATION_KAFKA_RETRY_ATTEMPTS:-8}
      - INTEGRATION_KAFKA_RETRY_INITIAL_DELAY=${INTEGRATION_KAFKA_RETRY_INITIAL_DELAY:-5s}
      - INTEGRATION_KAFKA_RETRY_MULTIPLIER=${INTEGRATION_KAFKA_RETRY_MULTIPLIER:-2.0}
      - INTEGRATION_KAFKA_RETRY_MAX_DELAY=${INTEGRATION_KAFKA_RETRY_MAX_DELAY:-10m}
      - INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX=${CIS_INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX:-cis-retry}
      - INTEGRATION_KAFKA_RETRY_DLT_SUFFIX=${CIS_INTEGRATION_KAFKA_RETRY_DLT_SUFFIX:-.cis.DLT}
    depends_on:
      nidan-integration-db:
        condition: service_healthy
      nidan-kafka:
        condition: service_healthy
      openmrs-db:
        condition: service_healthy
      openmrs-backend:
        condition: service_healthy
      # Orthanc dependency made optional - CIS can start without it if radiology is disabled
      orthanc:
        condition: service_started
    networks:
      - nidan-network
      - data-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CIS_PORT:-8081}/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nidan-ois:
    logging: *default-logging
    profiles: ["middleware","nidanehr-standard"]
    image: ${NIDAN_OIS_IMAGE:-nidan-ois:local}
    container_name: nidan-ois
    # no published port: reached through the gateway only (KC-02)
    environment:
      # Database
      - INTEGRATION_DB_URL=jdbc:postgresql://${INTEGRATION_DB_HOST:-nidan-integration-db}:${INTEGRATION_DB_PORT:-5432}/${INTEGRATION_DB_NAME:-nidan_integration}
      # own non-superuser login once scripts/app-db-roles.py has run (INTEGRATION_DB_APP_*); the superuser otherwise
      - INTEGRATION_DB_USER=${INTEGRATION_DB_APP_USER:-${INTEGRATION_DB_USER:-nidan}}
      - INTEGRATION_DB_PASSWORD=${INTEGRATION_DB_APP_PASSWORD:-${INTEGRATION_DB_PASSWORD:?set INTEGRATION_DB_PASSWORD (generate-secrets.sh writes .env.local)}}
      - MANAGEMENT_HEALTH_REDIS_ENABLED=${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=nidan-kafka:${KAFKA_PORT:-9092}
      - OIS_KAFKA_GROUP_ID=${OIS_KAFKA_GROUP_ID:-nidan-ois}
      - KAFKA_CONSUMER_REQUEST_TIMEOUT_MS=${KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:-45000}
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS=${KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:-15000}
      - KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS=${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:-600000}
      - KAFKA_CONSUMER_FETCH_MAX_WAIT_MS=${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:-500}
      - KAFKA_PRODUCER_REQUEST_TIMEOUT_MS=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-180000}
      - KAFKA_PRODUCER_LINGER_MS=${KAFKA_PRODUCER_LINGER_MS:-5}
      - KAFKA_METADATA_MAX_AGE_MS=${KAFKA_METADATA_MAX_AGE_MS:-300000}
      - KAFKA_RECONNECT_BACKOFF_MS=${KAFKA_RECONNECT_BACKOFF_MS:-500}
      - KAFKA_RECONNECT_BACKOFF_MAX_MS=${KAFKA_RECONNECT_BACKOFF_MAX_MS:-10000}
      # Odoo
      - ODOO_BASE_URL=${ODOO_BASE_URL:-http://odoo:8069}
      - ODOO_DATABASE=${ODOO_DB_NAME:-nidan}
      - ODOO_USERNAME=${ODOO_USERNAME:-nidan}
      - ODOO_PASSWORD=${ODOO_PASSWORD:?set ODOO_PASSWORD (generate-secrets.sh writes .env.local)}
      # Sync-account provisioning (OIS creates the account in Odoo on startup, via JSON-RPC)
      - NIDAN_SYNC_USERNAME=${NIDAN_SYNC_USERNAME:-nidan-sync}
      - NIDAN_SYNC_PASSWORD=${NIDAN_SYNC_PASSWORD:-}
      # Integration
      - OIS_WEBHOOK_SECRET=${OIS_WEBHOOK_SECRET:?set OIS_WEBHOOK_SECRET (generate-secrets.sh writes .env.local)}
      # Dead-letter UI/API login (HTTP Basic) until the gateway's cis-admin SSO gate (KC-10). Unset = refused.
      - DEAD_LETTER_ADMIN_USERNAME=${DEAD_LETTER_ADMIN_USERNAME:-dead-letter-admin}
      - DEAD_LETTER_ADMIN_PASSWORD=${DEAD_LETTER_ADMIN_PASSWORD:-}
      - NIDAN_DEPLOYMENT=${NIDAN_DEPLOYMENT:-}
      - SKIP_SOURCE_SYSTEMS_FOR_ODOO=${SKIP_SOURCE_SYSTEMS_FOR_ODOO:-ODOO}
      - NIDAN_OIS_URL=${NIDAN_OIS_URL:-http://nidan-ois:8082}
      - NIDAN_OIS_SECRET=${NIDAN_OIS_SECRET:?set NIDAN_OIS_SECRET (generate-secrets.sh writes .env.local)}
      - ODOO_NIDAN_SECRET=${ODOO_NIDAN_SECRET:?set ODOO_NIDAN_SECRET (generate-secrets.sh writes .env.local)}
      # Align with CIS / application.yml (radiology-mwl fallback)
      - ORTHANC_ENABLED=${ORTHANC_ENABLED:-true}
      # Per-flow toggles (integration.flows.* — see nidan-docker/env.template)
      - INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED:-true}
      - INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_OPENELIS_ENABLED=${INTEGRATION_FLOW_LAB_OPENELIS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_POS_ENABLED=${INTEGRATION_FLOW_LAB_POS_ENABLED:-true}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED:-true}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED:-true}
      # Kafka retry topics (opt-in via @KafkaRetryable)
      - INTEGRATION_KAFKA_RETRY_ENABLED=${INTEGRATION_KAFKA_RETRY_ENABLED:-false}
      - INTEGRATION_KAFKA_RETRY_ATTEMPTS=${INTEGRATION_KAFKA_RETRY_ATTEMPTS:-5}
      - INTEGRATION_KAFKA_RETRY_INITIAL_DELAY=${INTEGRATION_KAFKA_RETRY_INITIAL_DELAY:-5s}
      - INTEGRATION_KAFKA_RETRY_MULTIPLIER=${INTEGRATION_KAFKA_RETRY_MULTIPLIER:-2.0}
      - INTEGRATION_KAFKA_RETRY_MAX_DELAY=${INTEGRATION_KAFKA_RETRY_MAX_DELAY:-10m}
      - INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX=${OIS_INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX:-ois-retry}
      - INTEGRATION_KAFKA_RETRY_DLT_SUFFIX=${OIS_INTEGRATION_KAFKA_RETRY_DLT_SUFFIX:-.ois.DLT}
    depends_on:
      nidan-integration-db:
        condition: service_healthy
      nidan-kafka:
        condition: service_healthy
      odoo:
        condition: service_healthy
    networks:
      - nidan-network
      - data-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${OIS_PORT:-8082}/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # DHIS2 / FEDERAL HMIS INTEGRATION
  # ============================================================================
  nidan-dhis2-db:
    logging: *default-logging
    profiles: ["dhis2","nidanehr-standard"]
    image: mysql:8.0
    container_name: nidan-dhis2-db
    environment:
      MYSQL_DATABASE: ${DHIS2_DB_NAME:-nidan_dhis2}
      MYSQL_USER: ${DHIS2_DB_USER:-nidan}
      MYSQL_PASSWORD: ${DHIS2_DB_PASSWORD:?set DHIS2_DB_PASSWORD (generate-secrets.sh writes .env.local)}
      MYSQL_ROOT_PASSWORD: ${DHIS2_DB_ROOT_PASSWORD:?set DHIS2_DB_ROOT_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - dhis2-integration-db-data:/var/lib/mysql
    networks:
      - data-net          # databases and Kafka: only the services that use them (KC-43-03)
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DHIS2_DB_USER:-nidan}", "-p${DHIS2_DB_PASSWORD:?set DHIS2_DB_PASSWORD (generate-secrets.sh writes .env.local)}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nidan-dhis2:
    profiles: ["dhis2","nidanehr-standard"]
    image: trigonaltechnology/nidan-dhis2-integration:latest
    container_name: nidan-dhis2
    # no published port: reached through the gateway only (KC-02)
    volumes:
      # Runtime / persistent data and YAML config
      - ./dhis2/mappings:/app/mappings
      - ./dhis2/connections:/app/connections
      - ./dhis2/sql:/app/sql
      # Runtime / persistent data
      - dhis2-integration-data:/app/data
      - dhis2-integration-audit-logs:/app/audit_logs
      - dhis2-integration-app-logs:/app/logs
    environment:
      # Flask
      - SECRET_KEY=${DHIS2_SECRET_KEY:?set DHIS2_SECRET_KEY (generate-secrets.sh writes .env.local)}
      - DEBUG=${DHIS2_DEBUG:-false}
      - FLASK_ENV=${DHIS2_FLASK_ENV:-production}
      # Real sites set NIDAN_DEPLOYMENT=production: the app then refuses the public demo SECRET_KEY and short passwords.
      - NIDAN_DEPLOYMENT=${NIDAN_DEPLOYMENT:-}
      # Internal audit DB (dedicated MySQL)
      - DATABASE_URL=mysql+pymysql://${DHIS2_DB_USER:-nidan}:${DHIS2_DB_PASSWORD:?set DHIS2_DB_PASSWORD (generate-secrets.sh writes .env.local)}@${DHIS2_DB_HOST:-nidan-dhis2-db}:${DHIS2_DB_PORT:-3306}/${DHIS2_DB_NAME:-nidan_dhis2}
      # Auth
      - AUTH_PROVIDER=${DHIS2_AUTH_PROVIDER:-env_file}
      # Central login: set DHIS2_AUTH_PROVIDER=oidc (KC-40). Browser -> public URL; token/keys -> back-channel.
      - DHIS2_OIDC_AUTH_URL=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan/protocol/openid-connect/auth
      - DHIS2_OIDC_TOKEN_URL=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/token
      - DHIS2_OIDC_JWKS_URL=http://gateway:8099/auth/realms/nidan/protocol/openid-connect/certs
      - DHIS2_OIDC_ISSUER=${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan
      - DHIS2_OIDC_CLIENT_ID=dhis2
      - DHIS2_OIDC_CLIENT_SECRET=${KC_DHIS2_CLIENT_SECRET:-}
      - DHIS2_OIDC_REDIRECT_URI=https://${GATEWAY_DOMAIN:-localhost}/dhis2/auth/oidc/callback
      - ADMIN_USERNAME=${DHIS2_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${DHIS2_ADMIN_PASSWORD:?set DHIS2_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      - REPORTER_USERNAME=${DHIS2_REPORTER_USERNAME:-reporter}
      - REPORTER_PASSWORD=${DHIS2_REPORTER_PASSWORD:?set DHIS2_REPORTER_PASSWORD (generate-secrets.sh writes .env.local)}
      # Source DB connections — URLs built entirely from env vars
      - OPENMRS_DB_URL=mysql+pymysql://${REPORTING_DB_USER:-${OPENMRS_DB_USER}}:${REPORTING_DB_PASSWORD:-${OPENMRS_DB_PASSWORD}}@${OPENMRS_DB_HOST:-openmrs-db}:${OPENMRS_DB_PORT:-3306}/${OPENMRS_DB_NAME}
      - OPENELIS_DB_URL=postgresql://${REPORTING_DB_USER:-${OPENELIS_DB_USER:-clinlims}}:${REPORTING_DB_PASSWORD:-${OPENELIS_DB_PASSWORD}}@${OPENELIS_DB_HOST:-openelis-db}:${OPENELIS_DB_PORT:-5432}/${OPENELIS_DB_NAME:-clinlims}
      - ODOO_DB_URL=postgresql://${REPORTING_DB_USER:-${ODOO_DB_USER}}:${REPORTING_DB_PASSWORD:-${ODOO_DB_PASSWORD}}@${ODOO_DB_HOST:-odoo-db}:${ODOO_DB_PORT:-5432}/${ODOO_DB_NAME}
      # Connection settings
      - DB_CONNECT_TIMEOUT=${DHIS2_DB_CONNECT_TIMEOUT:-10}
      - DB_DATE_OVERLAP_BUFFER_DAYS=${DHIS2_DB_DATE_OVERLAP_BUFFER_DAYS:-2}
      # Federal HMIS (Nepal)
      - FEDERAL_HMIS_URL=${FEDERAL_HMIS_URL}
      - FEDERAL_HMIS_USERNAME=${FEDERAL_HMIS_USERNAME}
      - FEDERAL_HMIS_PASSWORD=${FEDERAL_HMIS_PASSWORD}
      - FEDERAL_HMIS_SSL_VERIFY=${FEDERAL_HMIS_SSL_VERIFY:-false}
      - FEDERAL_HMIS_ORG_UNIT=${FEDERAL_HMIS_ORG_UNIT}
      # Provincial DHIS2 (optional — leave blank to disable)
      - PROVINCIAL_DHIS2_URL=${PROVINCIAL_DHIS2_URL:-}
      - PROVINCIAL_DHIS2_USERNAME=${PROVINCIAL_DHIS2_USERNAME:-}
      - PROVINCIAL_DHIS2_PASSWORD=${PROVINCIAL_DHIS2_PASSWORD:-}
      - PROVINCIAL_DHIS2_SSL_VERIFY=${PROVINCIAL_DHIS2_SSL_VERIFY:-true}
      - PROVINCIAL_DHIS2_ORG_UNIT=${PROVINCIAL_DHIS2_ORG_UNIT:-}
    networks:
      - nidan-network
      - data-net
    depends_on:
      nidan-dhis2-db:
        condition: service_healthy
      openmrs-db:
        condition: service_healthy
      odoo-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect(('127.0.0.1', 5000))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # APACHE SUPERSET
  # ============================================================================
  superset:
    logging: *default-logging
    profiles: ["superset","nidanehr-standard"]
    build: ./superset
    image: ${SUPERSET_IMAGE:-trigonaltechnology/superset:latest}
    container_name: nidan-superset
    # no published port: reached through the gateway only (KC-02)
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY (32+ random chars)}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD}
      # Optional: enables embedded dashboards only when 32+ chars (superset_config.py).
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:-}
      # Central login (KC-39): on with SUPERSET_SSO_ENABLED, default NIDAN_SSO_ENABLED
      SUPERSET_SSO_ENABLED: ${SUPERSET_SSO_ENABLED:-${NIDAN_SSO_ENABLED:-false}}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}
      KC_SUPERSET_CLIENT_SECRET: ${KC_SUPERSET_CLIENT_SECRET:-}
      KC_OPENELIS_CLIENT_SECRET: ${KC_OPENELIS_CLIENT_SECRET:-}
      KC_CONFIG_CLI_CLIENT_SECRET: ${KC_CONFIG_CLI_CLIENT_SECRET:-}
      KC_AUTOMATION_CLIENT_SECRET: ${KC_AUTOMATION_CLIENT_SECRET:-}
      NIDAN_DEPLOYMENT: ${NIDAN_DEPLOYMENT:-}
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-no}
      PYTHONPATH: /app/pythonpath

      # CRITICAL: Set the public-facing base URL
      SUPERSET_WEBSERVER_ADDRESS: '0.0.0.0'
      SUPERSET_WEBSERVER_PORT: '8088'

      # Tell Superset it's behind a reverse proxy at /superset/.
      # Use SUPERSET_APP_ROOT (Superset 6 AppRootMiddleware), NOT the legacy
      # gunicorn SCRIPT_NAME env: with SCRIPT_NAME set, gunicorn strips
      # "/superset" and then AppRootMiddleware (active because APPLICATION_ROOT
      # = /superset) tries to strip it again, so every /superset/* route 404s.
      # SUPERSET_APP_ROOT drives the app prefix AND the base-image healthcheck
      # (curl http://localhost:$SUPERSET_PORT/$SUPERSET_APP_ROOT/health).
      SUPERSET_APP_ROOT: /superset
      SUPERSET_PORT: '8088'
      # Fix health check path issue
      SUPERSET_HEALTH_CHECK_ENDPOINT: /health

      # Database connections (seeded at startup for OpenMRS, OpenELIS, Odoo)
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:-openmrs-db}
      OPENMRS_DB_PORT: ${OPENMRS_DB_PORT:-3306}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:-openmrs}
      OPENMRS_DB_USER: ${REPORTING_DB_USER:-${OPENMRS_DB_USER:-openmrs}}
      OPENMRS_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-${OPENMRS_DB_PASSWORD:?set OPENMRS_DB_PASSWORD (generate-secrets.sh writes .env.local)}}
      OPENELIS_DB_HOST: ${OPENELIS_DB_HOST:-openelis-db}
      OPENELIS_DB_PORT: ${OPENELIS_DB_PORT:-5432}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME:-clinlims}
      OPENELIS_DB_USER: ${REPORTING_DB_USER:-${OPENELIS_DB_USER:-clinlims}}
      OPENELIS_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-${OPENELIS_DB_PASSWORD:?set OPENELIS_DB_PASSWORD (generate-secrets.sh writes .env.local)}}
      ODOO_DB_HOST: ${ODOO_DB_HOST:-odoo-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-nidan}
      ODOO_DB_USER: ${REPORTING_DB_USER:-${ODOO_DB_USER:-nidan}}
      ODOO_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD (generate-secrets.sh writes .env.local)}}

    command: [ "/bin/sh", "/app/docker-entrypoint.sh" ]
    networks:
      - nidan-network
      - data-net
    depends_on:
      openmrs-db:
        condition: service_healthy
      openelis-db:
        condition: service_healthy
      odoo-db:
        condition: service_healthy
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/nidan_sso.py:/app/pythonpath/nidan_sso.py:ro
      - ./superset/init_superset_metadata.py:/app/pythonpath/init_superset_metadata.py:ro
      - ./superset/pager.js:/app/pythonpath/pager.js:ro
      - ./superset/scroller.js:/app/pythonpath/scroller.js:ro
      - ./superset/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ./superset/metadata:/app/superset_metadata:ro
    restart: unless-stopped

  # ============================================================================
  # CENTRAL LOGIN (profile "sso", off by default; backlog KC-07). Keycloak and its DB live only on
  # auth-net; the admin console is reachable only through an SSH tunnel to 127.0.0.1:8180 (D34).
  # Keycloak's public origin (decision D1) is the gateway's :9443: KEYCLOAK_PUBLIC_URL, default
  # https://<GATEWAY_DOMAIN>:9443/auth. Browsers never reach Keycloak directly.
  # TODO(KC-01-01): first live import; TODO(KC-07-07): switch config-cli to its own client, remove bootstrap admin.
  # ============================================================================
  keycloak-db:
    logging: *default-logging
    profiles: ["sso"]
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: nidan-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - auth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    logging: *default-logging
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    container_name: nidan-keycloak
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      # own non-superuser login once scripts/app-db-roles.py has run (KEYCLOAK_DB_APP_*); the superuser otherwise
      KC_DB_USERNAME: ${KEYCLOAK_DB_APP_USER:-${KEYCLOAK_DB_USER:-keycloak}}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_APP_PASSWORD:-${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD (generate-secrets.sh writes .env.local)}}
      KC_HTTP_ENABLED: "true"                  # TLS ends at the gateway; keycloak is only on auth-net
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8180/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.31.250.10
      KC_HEALTH_ENABLED: "true"                # management port 9000, auth-net only (KC-07-05)
      KC_METRICS_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
    volumes:
      - ./keycloak/themes/nidan:/opt/keycloak/themes/nidan:ro   # login theme (KC-17)
      # email / SMS sign-in codes: build first (keycloak/providers/README.md); the realm's login flow needs it
      - ./keycloak/providers/dist:/opt/keycloak/providers:ro
      - ./keycloak/password-blocklist.txt:/opt/keycloak/data/password-blacklists/nidan.txt:ro   # passwordBlacklist(nidan.txt)
    networks:
      - auth-net
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Admin console for operators: 127.0.0.1:8180 (SSH tunnel) -> keycloak:8080 (KC-07-04). Keycloak itself is on the
  # internal auth-net, where Docker silently ignores published ports; this proxy is the only member of kc-admin-net.
  keycloak-admin-proxy:
    logging: *default-logging
    profiles: ["sso"]
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: nidan-keycloak-admin-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    volumes:
      - ./proxy/keycloak-admin-proxy.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8180:8180"                  # admin console via SSH tunnel only (KC-07-04)
    networks:
      - auth-net
      - kc-admin-net

  keycloak-config-cli:
    logging: *default-logging
    profiles: ["sso"]
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    container_name: nidan-keycloak-config-cli
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      # First import as the bootstrap admin (password grant); after it, set KEYCLOAK_CONFIG_CLI_CLIENT=nidan-config-cli
      # and KEYCLOAK_CONFIG_CLI_GRANT=client_credentials, then remove the bootstrap admin (KC-07-07).
      KEYCLOAK_GRANTTYPE: ${KEYCLOAK_CONFIG_CLI_GRANT:-password}
      KEYCLOAK_CLIENTID: ${KEYCLOAK_CONFIG_CLI_CLIENT:-admin-cli}
      KEYCLOAK_CLIENTSECRET: ${KC_CONFIG_CLI_CLIENT_SECRET:-}
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD (generate-secrets.sh writes .env.local)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/base/*.yaml,/config/master/*.yaml   # realm files only; roles/ catalogs are not imports
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_GROUP: full                     # groups not in the files are removed (no drift)
      # $(env:...) values for keycloak/realm/base/nidan.yaml; preflight rejects empty secrets in production
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      GATEWAY_AUTH_IP: 172.31.250.10                    # the gateway's fixed auth-net address (Odoo back-channel logout)
      NIDAN_BRAND_NAME: ${NIDAN_BRAND_NAME:-Nidan EHR}  # realm display name: login page tab title
      # email / SMS sign-in codes (optional; each channel stays off until set): env.template
      NIDAN_SMTP_HOST: ${NIDAN_SMTP_HOST:-}
      NIDAN_SMTP_PORT: ${NIDAN_SMTP_PORT:-587}
      NIDAN_SMTP_FROM: ${NIDAN_SMTP_FROM:-}
      NIDAN_SMTP_STARTTLS: ${NIDAN_SMTP_STARTTLS:-true}
      NIDAN_SMTP_AUTH: ${NIDAN_SMTP_AUTH:-true}
      NIDAN_SMTP_USER: ${NIDAN_SMTP_USER:-}
      NIDAN_SMTP_PASSWORD: ${NIDAN_SMTP_PASSWORD:-}
      NIDAN_SMS_PROVIDER: ${NIDAN_SMS_PROVIDER:-none}
      NIDAN_SMS_URL: ${NIDAN_SMS_URL:-}
      NIDAN_SMS_TOKEN: ${NIDAN_SMS_TOKEN:-}
      NIDAN_SMS_FROM: ${NIDAN_SMS_FROM:-}
      NIDAN_SYNC_USERNAME: ${NIDAN_SYNC_USERNAME:-nidan-sync}
      KC_USERNAME_PATTERN: ${KC_USERNAME_PATTERN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}             # login/Staff page language when the browser asks for none
      KC_GATEWAY_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET:-}
      KC_OPENMRS_CLIENT_SECRET: ${KC_OPENMRS_CLIENT_SECRET:-}
      KC_ODOO_CLIENT_SECRET: ${KC_ODOO_CLIENT_SECRET:-}
      KC_DHIS2_CLIENT_SECRET: ${KC_DHIS2_CLIENT_SECRET:-}
      KC_SUPERSET_CLIENT_SECRET: ${KC_SUPERSET_CLIENT_SECRET:-}
      KC_CIS_CLIENT_SECRET: ${KC_CIS_CLIENT_SECRET:-}
      KC_ODOO_SYNC_CLIENT_SECRET: ${KC_ODOO_SYNC_CLIENT_SECRET:-}
      KC_PORTAL_SYNC_CLIENT_SECRET: ${KC_PORTAL_SYNC_CLIENT_SECRET:-}
      KC_OPENELIS_CLIENT_SECRET: ${KC_OPENELIS_CLIENT_SECRET:-}
      KC_CONFIG_CLI_CLIENT_SECRET: ${KC_CONFIG_CLI_CLIENT_SECRET:-}     # master/automation.yaml sets the clients' own secrets
      KC_AUTOMATION_CLIENT_SECRET: ${KC_AUTOMATION_CLIENT_SECRET:-}
    volumes:
      - ./keycloak/realm:/config:ro
    networks:
      - auth-net
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  oauth2-proxy:
    logging: *default-logging
    profiles: ["sso"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    container_name: nidan-oauth2-proxy
    command: ["--config=/etc/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan
      OAUTH2_PROXY_LOGIN_URL: ${KEYCLOAK_PUBLIC_URL:-https://${GATEWAY_DOMAIN:-localhost}:9443/auth}/realms/nidan/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/auth/realms/nidan/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/nidan/protocol/openid-connect/certs
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${GATEWAY_DOMAIN:-localhost}:*   # post-login rd= only back to the gateway
    volumes:
      - ./proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    networks:
      - auth-net
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
