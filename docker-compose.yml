services:
  homepage:
    #image: nginx:alpine
    image : utsavd/nidan-proxy:lates
    container_name: nidan-homepage
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./certs/nginx.crt:/etc/nginx/certs/apache-selfsigned.crt:ro
      - ./keys/nginx.key:/etc/nginx/certs/apache-selfsigned.key:ro
      - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./volume/nginx/conf.d/:/etc/nginx/conf.d/
      #- ./volume/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      #- ./volume/nginx/conf.d/odoo.conf:/etc/nginx/conf.d/odoo.conf:ro
      #- ./volume/nginx/conf.d/openelis.conf:/etc/nginx/conf.d/openelis.conf:ro
      #- ./volume/nginx/conf.d/redirect.conf:/etc/nginx/conf.d/redirect.conf:ro


    depends_on:
      - certs
      - frontend
      - backend        
    #labels:
    #  - "traefik.enable=true"
    #  - traefik.http.middlewares.homepage-redirect.redirectscheme.scheme=https
    #  - "traefik.http.routers.homepage.rule=Host(`${NIDAN_HOME_HOST}`)"
    #  - "traefik.http.services.homepage.loadbalancer.server.port=80"
    #  - "traefik.http.routers.homepage.entrypoints=web"
    #  - traefik.http.routers.homepage-http.middlewares=homepage-redirect
    #  - traefik.http.routers.homepage.rule=Host(`${NIDAN_HOME_HOST}`)
    #  - traefik.http.routers.homepage.entrypoints=websecure
    #  - traefik.http.routers.homepage.tls.certresolver=letsencrypt 
    #  - traefik.http.services.homepage.loadbalancer.server.port=80
    ports:
       - "80:80"
       - "443:443"
       
    networks:
      - his_core


  #gateway:
  #  image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
  #  platform: linux/amd64
  #  restart: unless-stopped
  #  depends_on:
  #    - frontend
  #    - backend
  #  ports:
  #    - "8085:80"
  #  networks:
  #    - his_core
  #  profiles: ["core", "reports"]

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: unless-stopped
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE: en
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
      interval: 30s
      retries: 3
    depends_on:
      - backend
    networks:
      - his_core
    profiles: ["core", "reports"]

 

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: unless-stopped
    depends_on:
      - db_openmrs
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db_openmrs
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/openmrs"]
      timeout: 5s
      interval: 30s
      retries: 5
    volumes:
      - openmrs-data:/openmrs/data
    networks:
      - his_core
    profiles: ["core", "reports"]



  db_openmrs:
    image: mariadb:10.11.7
    restart: unless-stopped
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${OMRS_DB_USER:-openmrs}", "-p${OMRS_DB_PASSWORD:-openmrs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-openmrs-data:/var/lib/MySQL
    networks:
      - his_core
    profiles: ["core", "reports"]

  certs:
    container_name: oe-certs 
    image: itechuw/certgen:main
    platform: linux/amd64
    restart: always
    environment:
      - KEYSTORE_PW="kspass"
      - TRUSTSTORE_PW="tspass"
    networks:
      - his_core
    volumes:
      -  key_trust-store-volume:/etc/openelis-global
      -  keys-vol:/etc/ssl/private/
      -  certs-vol:/etc/ssl/certs/
    profiles: ["elis"]

  database:
    container_name: openelisglobal-database 
    image: postgres:14.4
    ports:
      - "15432:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=clinlims
      - POSTGRES_INITDB_ARGS="--auth-host=md5"
    volumes:
         # preserves the database between containers
      - db-data:/var/lib/postgresql/data                
         # files here will run on install
      - ./volume/database/dbInit:/docker-entrypoint-initdb.d
    networks:
      - his_core
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
      timeout: 45s
      interval: 10s
      retries: 10 
    profiles: ["elis"]
       
  oe.openelis.org:
    container_name: openelisglobal-webapp 
    image: itechuw/openelis-global-2:develop   
    platform: linux/amd64 
    depends_on:
      - database
      - certs
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: always
    networks:
      - his_core
    environment:
      - DEFAULT_PW=adminADMIN! 
      - TZ=Africa/Nairobi
       # context.xml doesn't seem to be able to pick up environment variables directly, so we are passing them in as CATALINA_OPTS
      - CATALINA_OPTS= -Ddatasource.url=jdbc:postgresql://database:5432/clinlims -Ddatasource.username=clinlims
    volumes:
      -  key_trust-store-volume:/etc/openelis-global
      - ./volume/plugins/:/var/lib/openelis-global/plugins
      - ./volume/tomcat/oe_server.xml:/usr/local/tomcat/conf/server.xml
      -  lucene_index-vol:/var/lib/lucene_index
      - ./volume/test-map/test-loinc-map.csv:/var/lib/openelis-global/plugin-test-mappings/test-loinc-map.csv
      - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
      - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
      #Runing OpenELIS with the locally compiled war file
      #- ./target/OpenELIS-Global.war:/usr/local/tomcat/webapps/OpenELIS-Global.war
    secrets:
      - source: datasource.password
      - source: common.properties
    profiles: ["elis"]
        
  fhir.openelis.org:
    container_name: external-fhir-api
    image: itechuw/openelis-global-2-fhir:develop
    platform: linux/amd64
    depends_on:
      - database
      - certs
    ports:
      - "8081:8080"
      - "8444:8443"
    networks:
      - his_core
    restart: always
    environment:
      SPRING_CONFIG_LOCATION: file:///run/secrets/hapi_application.yaml
      TZ: Africa/Nairobi
    
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/openelis-global/truststore 
      		  -Djavax.net.ssl.trustStorePassword=tspass
      		  -Djavax.net.ssl.trustStoreType=pkcs12 
      		  -Djavax.net.ssl.keyStore=/etc/openelis-global/keystore 
      		  -javax.net.ssl.keyStorePassword=kspass 
      		  -Djavax.net.ssl.keyStoreType=pkcs12"            
    profiles: ["elis"]    
    volumes:
      -  key_trust-store-volume:/etc/openelis-global
      - ./volume/tomcat/hapi_server.xml:/opt/bitnami/tomcat/conf/server.xml
    secrets:
      - source: hapi_application.yaml 


         
  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:develop
    container_name: openelisglobal-front-end
    platform: linux/amd64
    networks:
      - his_core
    environment:
      - CHOKIDAR_USEPOLLING=true
    tty: true
    profiles: ["elis"]

      
  #openmrs-frontend:
  #  image: openmrs/openmrs-reference-application-3-frontend:${OPENMRS_IMAGE_TAG:-qa}
  #  restart: unless-stopped
  #  environment:
  #    TZ: ${DEFAULT_TIMEZONE}
  #  depends_on:
  #    openmrs-backend:
  #      condition: service_started
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
  #    interval: 30s
  ##    timeout: 10s
   #   retries: 5
  #  labels:
  #    - traefik.enable=true
  #    - traefik.http.routers.openmrs-spa.rule=Host(`${OPENMRS_HOST}`) && PathPrefix(`/openmrs/spa`)
  ##    - traefik.http.routers.openmrs-spa.entrypoints=websecure
  #    - traefik.http.routers.openmrs-spa.tls.certresolver=letsencrypt
  #    - traefik.http.routers.openmrs-spa.middlewares=openmrs-spa-strip
