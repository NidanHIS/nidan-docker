version: "3.9"

networks:
  nidan-network:
    driver: bridge

volumes:
  openmrs-data:
  openmrs-db-data:
  odoo-data:
  odoo-db-data:
  orthanc-data:
  orthanc-db-data:
  keycloak-db-data:
  
services:
  # ============================================================================
  # PROXY / GATEWAY
  # ============================================================================
  gateway:
    build: ./proxy
    image: nidan/gateway:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nidan-network
    depends_on:
      - openmrs-frontend
      - odoo
      - keycloak

  # ============================================================================
  # OPENMRS
  # ============================================================================
  openmrs-backend:
    build: ./openmrs
    image: nidan/openmrs-backend:3.0
    container_name: nidan-openmrs-backend
    environment:
      - DB_DATABASE=openmrs
      - DB_USERNAME=openmrs
      - DB_PASSWORD=openmrs
      - DB_HOST=openmrs-db
    networks:
      - nidan-network
    depends_on:
      - openmrs-db

  openmrs-frontend:
    build: ./openmrs/frontend
    image: nidan/openmrs-frontend:3.0
    container_name: nidan-openmrs-frontend
    networks:
      - nidan-network
    depends_on:
      - openmrs-backend

  openmrs-db:
    image: mariadb:10.6
    container_name: nidan-openmrs-db
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - nidan-network

  # ============================================================================
  # ODOO
  # ============================================================================
  odoo:
    build: ./odoo
    image: nidan/odoo:19
    container_name: nidan-odoo
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - nidan-network
    depends_on:
      - odoo-db

  odoo-db:
    image: postgres:15
    container_name: nidan-odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_ODOO_DB: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_USER: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # KEYCLOAK
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: nidan-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HTTP_RELATIVE_PATH: /auth
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
    networks:
      - nidan-network
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:15
    container_name: nidan-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # ORTHANC
  # ============================================================================
  orthanc:
    build: ./orthanc
    image: nidan/orthanc:latest
    container_name: nidan-orthanc
    environment:
      ORTHANC_DB_HOST: orthanc-db
    networks:
      - nidan-network
    depends_on:
      - orthanc-db

  orthanc-db:
    image: postgres:15
    container_name: nidan-orthanc-db
    environment:
      POSTGRES_DB: orthanc
      POSTGRES_USER: orthanc
      POSTGRES_PASSWORD: orthanc_password
    volumes:
      - orthanc-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # OPENELIS (Placeholder)
  # ============================================================================
