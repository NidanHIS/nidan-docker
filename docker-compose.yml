networks:
  nidan-network:
    driver: bridge

volumes:
  openmrs-data:
  openmrs-db-data:
  odoo-data:
  odoo-db-data:
  orthanc-data:
  orthanc-db-data:
  keycloak-db-data:
  openelis-db-data:
  openelis-lucene-index:
  certbot-etc:
  certbot-www:


services:
  # ============================================================================
  # PROXY / GATEWAY
  # ============================================================================
  gateway:
    build: ./proxy
    image: nidan/gateway:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:-localhost}
      - OPENELIS_DOMAIN=${OPENELIS_DOMAIN}
    networks:
      - nidan-network
    depends_on:
      - openmrs-frontend
      - odoo
      - keycloak
      - openelis
      - nidan-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  # ============================================================================
  # OPENMRS
  # ============================================================================
  openmrs-backend:
    # build: ./openmrs
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    container_name: nidan-openmrs-backend
    environment:
      - DB_DATABASE=${OPENMRS_DB_NAME}
      - DB_USERNAME=${OPENMRS_DB_USER}
      - DB_PASSWORD=${OPENMRS_DB_PASSWORD}
      - DB_HOST=${OPENMRS_DB_HOST}
      - OMRS_DB_HOSTNAME=${OPENMRS_DB_HOST}
      - OMRS_DB_NAME=${OPENMRS_DB_NAME}
      - OMRS_DB_USERNAME=${OPENMRS_DB_USER}
      - OMRS_DB_PASSWORD=${OPENMRS_DB_PASSWORD}
      - OMRS_DB_PORT=3306
    networks:
      - nidan-network
    depends_on:
      - openmrs-db
    volumes:
      - ./openmrs/runtime/openmrs-runtime.properties:/openmrs/openmrs-runtime.properties:ro
      - ./openmrs/runtime/openmrs-runtime.properties:/usr/local/tomcat/openmrs-runtime.properties:ro

  openmrs-frontend:
    # build: ./openmrs/frontend
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    container_name: nidan-openmrs-frontend
    environment:
      - SPA_PATH=/openmrs/spa
      - API_URL=/openmrs
      - SPA_CONFIG_URLS=
    volumes:
      - ./openmrs/frontend/nginx-override.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nidan-network
    depends_on:
      - openmrs-backend

  openmrs-db:
    image: mariadb:10.6
    container_name: nidan-openmrs-db
    environment:
      MYSQL_DATABASE: ${OPENMRS_DB_NAME}
      MYSQL_USER: ${OPENMRS_DB_USER}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - nidan-network

  # ============================================================================
  # ODOO
  # ============================================================================
  odoo:
    build: ./odoo
    image: nidan/odoo:19
    container_name: nidan-odoo
    ports:
      - "8069:8069"
    environment:
      # Odoo reads these environment variables automatically
      - HOST=${ODOO_DB_HOST}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - PORT=${ODOO_DB_PORT}
      - ODOO_DB_NAME=${ODOO_DB_NAME}
      - ODOO_ADMIN_EMAIL=${ODOO_ADMIN_EMAIL:-nidan}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD:-nidan}
      # PostgreSQL superuser for database creation
      - POSTGRES_USER=${ODOO_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ODOO_POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - nidan-network
    depends_on:
      odoo-db:
        condition: service_healthy

  odoo-db:
    image: postgres:15
    container_name: nidan-odoo-db
    environment:
      POSTGRES_DB: ${ODOO_POSTGRES_DB}
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      POSTGRES_USER: ${ODOO_POSTGRES_USER}
      # Pass Odoo DB config to init script
      ODOO_DB_NAME: ${ODOO_DB_NAME}
      ODOO_DB_USER: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - ./odoo-db/init-odoo-db.sh:/docker-entrypoint-initdb.d/init-odoo-db.sh:ro
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ODOO_POSTGRES_USER:-odoo} -d ${ODOO_POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # KEYCLOAK
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: nidan-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_RELATIVE_PATH}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
      - ./openelis/keycloak:/opt/keycloak/data/import/openelis
      - certbot-etc:/etc/letsencrypt:ro
    networks:
      - nidan-network
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:15
    container_name: nidan-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # ORTHANC
  # ============================================================================
  orthanc:
    build: ./orthanc
    image: nidan/orthanc:latest
    container_name: nidan-orthanc
    environment:
      ORTHANC_DB_HOST: ${ORTHANC_DB_HOST}
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__REGISTERED_USERS__${ORTHANC_USERNAME:-nidan}: ${ORTHANC_PASSWORD:-nidan}
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__PUBLIC_ROOT: "/orthanc-container/dicom-web/"
      ORTHANC__ORTHANC_EXPLORER_2__UI_OPTIONS__ENABLE_OPEN_IN_OHIF_VIEWER_3: "true"
      ORTHANC__ORTHANC_EXPLORER_2__UI_OPTIONS__OHIF_VIEWER_3_PUBLIC_ROOT: "/orthanc-container/ohif/"
    networks:
      - nidan-network
    depends_on:
      - orthanc-db
    volumes:
      - certbot-etc:/etc/letsencrypt:ro

  orthanc-db:
    image: postgres:15
    container_name: nidan-orthanc-db
    environment:
      POSTGRES_DB: ${ORTHANC_DB_NAME}
      POSTGRES_USER: ${ORTHANC_DB_USER}
      POSTGRES_PASSWORD: ${ORTHANC_DB_PASSWORD}
    volumes:
      - orthanc-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # OPENELIS (Placeholder)
  # ============================================================================
  nidan-certbot:
    image: certbot/certbot:latest
    container_name: nidan-certbot
    entrypoint: "/bin/sh -c 'trap \"exit 0\" TERM; while :; do certbot renew --webroot -w /var/www/certbot --agree-tos --noninteractive --keep-until-expiring; sleep 12h & wait $${!}; done;'"
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - nidan-network

  openelis-db:
    image: postgres:15
    container_name: nidan-openelis-db
    environment:
      POSTGRES_DB: ${OPENELIS_DB_NAME:-clinlims}
      POSTGRES_USER: ${OPENELIS_DB_USER:-clinlims}
      POSTGRES_PASSWORD: ${OPENELIS_DB_PASSWORD:-changeme}
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${OPENELIS_DB_USER:-clinlims} -d ${OPENELIS_DB_NAME:-clinlims}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenELIS backend (Tomcat)
  openelis:
    build: ./openelis
    image: itechuw/openelis-global-2:develop
    platform: linux/amd64
    container_name: nidan-openelis
    depends_on:
      - openelis-db
    environment:
      - DEFAULT_PW=${OPENELIS_DEFAULT_ADMIN_PASSWORD:-adminADMIN!}
      - TZ=${OPENELIS_TZ:-UTC}
      - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://openelis-db:5432/${OPENELIS_DB_NAME:-clinlims} -Ddatasource.username=${OPENELIS_DB_USER:-clinlims} -Ddatasource.password=${OPENELIS_DB_PASSWORD:-changeme}
    networks:
      - nidan-network
    volumes:
      - ./openelis/volume/properties:/var/lib/openelis-global/properties
      - ./openelis/volume/configuration:/var/lib/openelis-global/configuration
      - ./openelis/volume/plugins:/var/lib/openelis-global/plugins
      - ./openelis/volume/ocl:/var/lib/openelis-global/ocl
      - ./openelis/volume/logs/oeLogs:/var/lib/openelis-global/logs
      - ./openelis/volume/logs/tomcatLogs:/usr/local/tomcat/logs
      - ./openelis/volume/analyzer:/var/lib/openelis-global/analyzer
      - ./openelis/volume/odoo:/var/lib/openelis-global/odoo
      - openelis-lucene-index:/var/lib/lucene_index
      - ./openelis/volume/properties/common.properties:/run/secrets/common.properties:ro
      - ./openelis/volume/certs:/etc/openelis-global:ro

  # OpenELIS FHIR
  openelis-fhir:
    image: itechuw/openelis-global-2-fhir:develop
    platform: linux/amd64
    container_name: nidan-openelis-fhir
    depends_on:
      - openelis-db
    environment:
      TZ: ${OPENELIS_TZ:-UTC}
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH} -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD} -Djavax.net.ssl.trustStoreType=pkcs12 -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH} -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD} -Djavax.net.ssl.keyStoreType=pkcs12"
      CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH} -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH} -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}"
      FHIR_DATASOURCE_URL: "jdbc:postgresql://openelis-db:5432/${OPENELIS_DB_NAME:-clinlims}?currentSchema=clinlims"
      FHIR_DATASOURCE_USERNAME: "${OPENELIS_DB_USER:-clinlims}"
      FHIR_DATASOURCE_PASSWORD: "${OPENELIS_DB_PASSWORD:-changeme}"
      FHIR_SERVER_ADRESS: "http://openelis-fhir:8080/fhir/"
    networks:
      - nidan-network
    volumes:
      - ./openelis/volume/properties/hapi_application.yaml:/bitnami/tomcat/conf/hapi_application.yaml:ro

  # OpenELIS Frontend
  openelis-frontend:
    image: itechuw/openelis-global-2-frontend:3.2.0.2
    platform: linux/amd64
    container_name: nidan-openelis-frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - nidan-network

  # OHIF Viewer
  ohif:
    image: ohif/app:latest
    container_name: nidan-ohif
    environment:
      - PUBLIC_URL=/ohif/
      - REACT_APP_CONFIG_FILE=/usr/share/nginx/html/app-config.js
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    networks:
      - nidan-network
