# oauth2-proxy for the gateway (backlog KC-10, spec section 4). Secrets and site values come from env
# (OAUTH2_PROXY_*), set in docker-compose.yml. scripts/nidan-auth-check.py enforces KC-10-13 on this file.
#
# Keycloak is reached two ways: the browser goes to the public login URL (KEYCLOAK_PUBLIC_URL); the
# code exchange and the signing keys go straight to keycloak:8080 on auth-net (no route out).
# OIDC discovery is skipped for that reason; the issuer is still checked against the public URL.
# TODO(KC-01-01): verify against live Keycloak (no-email users, role groups "role:nidan-gateway:<role>").

http_address = "0.0.0.0:4180"
reverse_proxy = true                 # only the gateway reaches us (auth-net); nidan-auth-check checks it
trusted_proxy_ips = ["172.31.250.10/32"]   # X-Forwarded-* only from the gateway (its fixed auth-net address)
upstreams = ["static://202"]         # auth_request only: never proxies an app
provider = "keycloak-oidc"
client_id = "nidan-gateway"
skip_oidc_discovery = true
redirect_url = "/oauth2/callback"    # relative: same host and port the user came in on
scope = "openid"
code_challenge_method = "S256"
skip_jwt_bearer_tokens = false       # a Bearer header never replaces the session
user_id_claim = "preferred_username"   # staff may have no email; username is the identity
email_domains = ["*"]                # access is decided per app by role (allowed_groups), not email
insecure_oidc_allow_unverified_email = true   # staff have no verified email (email is optional)

cookie_name = "_oauth2_proxy"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "12h"                # = ssoSessionMaxLifespan
cookie_refresh = "1m"                # re-checks Keycloak: a disabled user is out within ~6 min

set_xauthrequest = true              # X-Auth-Request-User / -Groups for nginx (cleared from clients)
# the auth check answers with X-Auth-Request-Access-Token too. nginx keeps it inside the gateway: only the Staff API
# forwards it, to Keycloak's admin API, as the hospital admin's own credential (KC-20; apps never receive it)
pass_access_token = true
pass_authorization_header = false
# /oauth2/sign_out also ends the Keycloak session (server side, over auth-net); {id_token} is filled in.
backend_logout_url = "http://keycloak:8080/auth/realms/nidan/protocol/openid-connect/logout?id_token_hint={id_token}"
skip_provider_button = true
show_debug_on_error = false
silence_ping_logging = true
# KC-13-02: no RequestURI in request logs. After a login redirect the URI is /oauth2/start?rd=<page>?<query>, and a
# query can hold a patient's name. (Rejected, i.e. forged, rd values still appear in oauth2-proxy's runtime log.)
request_logging_format = "{{.Client}} - {{.RequestID}} - {{.Username}} [{{.Timestamp}}] {{.Host}} {{.RequestMethod}} {{.Upstream}} {{.Protocol}} {{.StatusCode}} {{.ResponseSize}} {{.RequestDuration}}"
banner = "-"
footer = "-"
