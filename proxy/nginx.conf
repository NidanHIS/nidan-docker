worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    # Re-resolve upstream container IPs in Docker network
    resolver 127.0.0.11 valid=30s ipv6=off;
    sendfile        on;
    keepalive_timeout  65;

    upstream openmrs_backend {
        server openmrs-backend:8080;
    }
    
    # Map config.json to config-core_demo.json for OpenMRS frontend
    map $request_uri $config_file {
        ~^/openmrs/spa/config\.json$ /config-core_demo.json;
        default $request_uri;
    }
    
    upstream keycloak_server {
        server keycloak:8080;
    }
    
    upstream odoo_server {
        server odoo:8069;
    }

    upstream orthanc_server {
        server orthanc:8042;
    }



    upstream openelis_backend {
        server openelis:8080;
    }

    map $http_host $acme_root {
        default /var/www/certbot;
    }

    # HTTP -> ACME/redirect
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root $acme_root;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name _;

        # Use the generated/self-signed cert (or real cert) for the gateway
        ssl_certificate     /etc/letsencrypt/live/localhost/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Keycloak
        location /auth/ {
            proxy_pass http://keycloak_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend API
        location /openmrs/ws {
             proxy_pass http://openmrs-backend:8080/openmrs/ws;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend pages
        location ~ ^/openmrs/(initialsetup|module|login|logout|admin|legacy) {
            proxy_pass http://openmrs-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Frontend (SPA)
        location = /openmrs/spa/config.json {
            rewrite ^/openmrs/spa/config\.json$ /config-core_demo.json break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location = /openmrs/spa {
            return 301 /openmrs/spa/;
        }

        location /openmrs/spa/ {
            rewrite ^/openmrs/spa/(.*)$ /$1 break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # OpenMRS backend entrypoints (no SPA redirect)
        location = /openmrs {
            proxy_pass http://openmrs-backend:8080/openmrs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /openmrs/ {
            proxy_pass http://openmrs-backend:8080/openmrs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openmrs/ {
            proxy_pass http://openmrs-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Odoo
        location = /odoo {
            return 301 /odoo/web;
        }
        location = /odoo/ {
            return 301 /odoo/web;
        }
        location /odoo/ {
            proxy_pass http://odoo_server/; 
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /odoo;
            proxy_redirect / /odoo/;
            
            # Disable compression so sub_filter works
            proxy_set_header Accept-Encoding "";
            
            # Rewrite HTML content for relative links
            sub_filter 'href="/web' 'href="/odoo/web';
            sub_filter 'src="/web' 'src="/odoo/web';
            sub_filter 'action="/web' 'action="/odoo/web';
            sub_filter 'data-src="/web' 'data-src="/odoo/web';
            sub_filter_once off;
            
            proxy_cookie_path / /odoo/;
        }
        
        # Orthanc (new path)
        # Strip /orthanc-container prefix before forwarding to Orthanc
        location /orthanc-container/ {
            rewrite ^/orthanc-container/(.*)$ /$1 break;
            proxy_pass http://orthanc_server;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$http_host;proto=$scheme";
        }
        # Legacy path -> redirect to new
        location /orthanc/ {
            return 301 /orthanc-container/;
        }
        # Fix Explorer 2 path used by legacy UI buttons
        location = /ui/app/index.html {
            return 301 /orthanc-container/ui/app/index.html#/;
        }
        location /ui/app/ {
            return 301 /orthanc-container/ui/app/index.html#/;
        }



        # OpenELIS (direct to backend)
        location /openelis/ {
            proxy_pass http://openelis_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Default fallback - Dashboard
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
