        }

        location = /cis/ {
            return 301 /dead-letters/index.html;
        }

        location /cis/ {
            set $cis_backend "nidan-cis:8081";
            rewrite ^/cis/(.*)$ /$1 break;
            proxy_pass http://$cis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cis;
            proxy_redirect off;
        }

        location /dead-letters {
            set $cis_backend "nidan-cis:8081";
            proxy_pass http://$cis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /api/dead-letters {
            set $cis_backend "nidan-cis:8081";
            rewrite ^/api/dead-letters/?$ /api/dead-letters break;
            proxy_pass http://$cis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
