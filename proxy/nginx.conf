worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream openmrs_backend {
        server openmrs-backend:8080;
    }
    
    # Map config.json to config-core_demo.json for OpenMRS frontend
    map $request_uri $config_file {
        ~^/openmrs/spa/config\.json$ /config-core_demo.json;
        default $request_uri;
    }
    
    upstream keycloak_server {
        server keycloak:8080;
    }
    
    upstream odoo_server {
        server odoo:8069;
    }

    # Upstream for Orthanc
    upstream orthanc_server {
        server orthanc:8042;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Keycloak (Auth) - Proxying to Keycloak which now expects /auth prefix due to env var
        location /auth/ {
            proxy_pass http://keycloak_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. OpenMRS Backend API (must take precedence - exact match first)
        location /openmrs/ws {
             proxy_pass http://openmrs-backend:8080/openmrs/ws;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend - handle setup and other backend pages (but not /spa)
        location ~ ^/openmrs/(initialsetup|module|login|logout|admin|legacy) {
            proxy_pass http://openmrs-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. OpenMRS Frontend (SPA) - must come after backend routes
        location = /openmrs {
            return 302 /openmrs/spa;
        }
        
        # OpenMRS Frontend SPA - strip /openmrs/spa prefix when forwarding
        location /openmrs/spa {
            # Handle config.json specially - map to config-core_demo.json
            if ($request_uri ~ ^/openmrs/spa/config\.json$) {
                rewrite ^/openmrs/spa/config\.json$ /config-core_demo.json break;
                proxy_pass http://openmrs-frontend;
                break;
            }
            rewrite ^/openmrs/spa(/.*)$ $1 break;
            rewrite ^/openmrs/spa$ /index.html break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        
        # Default /openmrs/ to frontend SPA (strip /openmrs prefix)
        location /openmrs/ {
            rewrite ^/openmrs(.*)$ $1 break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 4. Odoo - Strip the /odoo prefix
        location /odoo/ {
            # Trailing slash in proxy_pass implies stripping the matching part of uri
            proxy_pass http://odoo_server/; 
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Odoo creates cookies with root path, we need to rewrite them
            proxy_cookie_path / /odoo/;
        }
        
        # 5. Orthanc
        location /orthanc/ {
            proxy_pass http://orthanc_server/;
            proxy_set_header Host $host;
            # Orthanc requires this header specifically to know it's behind a proxy
            proxy_set_header Forwarded "host=$http_host;proto=$scheme";
        }
        
        # Default fallback - Dashboard
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
