worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream openmrs_backend {
        server openmrs-backend:8080;
    }
    
    # Map config.json to config-core_demo.json for OpenMRS frontend
    map $request_uri $config_file {
        ~^/openmrs/spa/config\.json$ /config-core_demo.json;
        default $request_uri;
    }
    
    upstream keycloak_server {
        server keycloak:8080;
    }
    
    upstream odoo_server {
        server odoo:8069;
    }

    upstream orthanc_server {
        server orthanc:8042;
    }

    upstream ohif_server {
        server ohif:80;
    }

    upstream openelis_backend {
        server openelis:8080;
    }

    map $http_host $acme_root {
        default /var/www/certbot;
    }

    # HTTP -> ACME/redirect
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root $acme_root;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name _;

        # Use the generated/self-signed cert (or real cert) for the gateway
        ssl_certificate     /etc/letsencrypt/live/localhost/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Keycloak
        location /auth/ {
            proxy_pass http://keycloak_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend API
        location /openmrs/ws {
             proxy_pass http://openmrs-backend:8080/openmrs/ws;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend pages
        location ~ ^/openmrs/(initialsetup|module|login|logout|admin|legacy) {
            proxy_pass http://openmrs-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Frontend
        location = /openmrs {
            return 302 /openmrs/spa;
        }
        
        location /openmrs/spa {
            if ($request_uri ~ ^/openmrs/spa/config\.json$) {
                rewrite ^/openmrs/spa/config\.json$ /config-core_demo.json break;
                proxy_pass http://openmrs-frontend;
                break;
            }
            rewrite ^/openmrs/spa(/.*)$ $1 break;
            rewrite ^/openmrs/spa$ /index.html break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        
        location /openmrs/ {
            rewrite ^/openmrs(.*)$ $1 break;
            proxy_pass http://openmrs-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Odoo
        location /odoo/ {
            proxy_pass http://odoo_server/; 
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / /odoo/;
        }
        
        # Orthanc (new path)
        location /orthanc-container/ {
            proxy_pass http://orthanc_server/;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$http_host;proto=$scheme";
        }
        # Legacy path -> redirect to new
        location /orthanc/ {
            return 301 /orthanc-container/;
        }

        # OHIF
        location /ohif/ {
            proxy_pass http://ohif_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenELIS (direct to backend)
        location /openelis/ {
            proxy_pass http://openelis_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Default fallback - Dashboard
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
