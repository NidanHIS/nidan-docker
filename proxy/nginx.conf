worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile on;
    keepalive_timeout 65;

    log_format debug_log '[$time_local] "$request" status:$status up_status:$upstream_status '
                         'up_addr:$upstream_addr forwarded_proto:$http_x_forwarded_proto '
                         'sent_proto:$sent_http_x_forwarded_proto';
    access_log /var/log/nginx/debug.log debug_log;

    upstream openmrs_frontend {
        server openmrs-frontend:80;
    }

    upstream openmrs_backend {
        server openmrs-backend:8080;
    }

    upstream keycloak_server { server keycloak:8080; }
    upstream odoo_server { server odoo:8069; }
    upstream orthanc_server { server orthanc:8042; }
    upstream openelis_backend {
        zone openelis_backend 64k;
        server openelis:8080 resolve;
    }
    upstream openelis_frontend {
        zone openelis_frontend 64k;
        server openelis-frontend:80 resolve;
    }

    # ----------------------------------------------------------------
    # Port 8443 — catches the hardcoded https://localhost:8443/OpenELIS-Global/*
    # calls baked into the pre-built frontend image's config.json.
    # nginx terminates TLS here and proxies to openelis:8080 over plain HTTP.
    # This is the ONLY way to fix CORS without rebuilding the frontend image.
    # ----------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1 _;

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy all OpenELIS-Global paths directly to the backend
        location /OpenELIS-Global/ {
            proxy_pass http://openelis_backend/OpenELIS-Global/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Host $host;

            # Remap session cookies from backend context to gateway context
            proxy_cookie_path /OpenELIS-Global/ /OpenELIS-Global/;
            proxy_redirect http://$host:8080/OpenELIS-Global/ https://$host:8443/OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/LoginPage https://$host/openelis/login;
        }
    }

    # ----------------------------------------------------------------
    # HTTP server — localhost gets full service (no HTTPS redirect)
    # All other hostnames redirect to HTTPS.
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        absolute_redirect off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ------- OpenELIS Backend API -------
        location = /api/OpenELIS-Global/openelis/ {
            return 302 /api/OpenELIS-Global/MasterListsPage;
        }

        location ~ ^/api/OpenELIS-Global/(.*)$ {
            add_header X-Debug-Hit "true" always;
            rewrite ^/api/OpenELIS-Global/(.*)$ /OpenELIS-Global/$1 break;
            proxy_pass http://openelis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            proxy_cookie_flags ~ nosecure;
            proxy_redirect /OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect /api/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect /OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect http://$host:8080/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect http://$host/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://$host:8443/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://localhost:8443/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://$host/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://localhost/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://$host:8443/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect https://localhost:8443/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect https://$host/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect https://localhost/OpenELIS-Global/ /api/OpenELIS-Global/;
        }

        # Legacy direct backend path
        location ~ ^/OpenELIS-Global/(.*)$ {
            proxy_pass http://openelis_backend/OpenELIS-Global/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global/ /OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/ /OpenELIS-Global/;
        }

        # ------- OpenELIS Frontend (React SPA) -------
        location = /openelis {
            return 301 /openelis/;
        }

        # Strip /openelis/ prefix before proxying to the frontend container.
        # The React app is built with PUBLIC_URL=/openelis, so its internal nginx
        # already expects to serve assets from / (the strip is done here).
        # The frontend container's nginx handles SPA try_files on its end.
        location = /openelis/service-worker.js {
            return 404;
        }

        location /openelis/ {
            rewrite ^/openelis/(.*)$ /$1 break;
            proxy_pass http://openelis_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Force browser to clear its cache and service-worker storage
            add_header Clear-Site-Data '"cache", "storage"';
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # ------- Other services (optional, accessible on HTTP for localhost) -------
        location /openmrs/ws {
            proxy_pass http://openmrs_backend/openmrs/ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /openmrs/ {
            proxy_pass http://openmrs_backend/openmrs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /odoo/ {
            proxy_pass http://odoo_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /odoo;
            proxy_cookie_path / /odoo/;
            proxy_redirect / /odoo/;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ----------------------------------------------------------------
    # HTTP -> HTTPS redirect for real domain names
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------
    # HTTPS server (production / real domain)
    # ----------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # -------------------------------
        # Keycloak
        # -------------------------------
        location /auth/ {
            proxy_pass http://keycloak_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend API (must come before /openmrs/ to match first)
        location /openmrs/ws {
            proxy_pass http://openmrs-backend:8080/openmrs/ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # OpenMRS Backend pages
        location ~ ^/openmrs/(initialsetup|module|login|logout|admin|legacy) {
            proxy_pass http://openmrs-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Frontend (SPA)
        location = /openmrs/spa/config.json {
            rewrite ^/openmrs/spa/config\.json$ /config-core_demo.json break;
            proxy_pass http://openmrs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location = /openmrs/spa {
            return 301 /openmrs/spa/;
        }

        location /openmrs/spa/ {
            rewrite ^/openmrs/spa/(.*)$ /$1 break;
            proxy_pass http://openmrs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # OpenMRS backend entrypoints (no SPA redirect)
        location = /openmrs {
            proxy_pass http://openmrs-backend:8080/openmrs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /openmrs/ {
            proxy_pass http://openmrs-backend:8080/openmrs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend catch-all (must come after more specific locations)
        location /openmrs/ {
            proxy_pass http://openmrs-backend:8080/openmrs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # -------------------------------
        # Odoo
        # -------------------------------
        location /odoo/ {
            proxy_pass http://odoo_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /odoo;

            proxy_set_header Accept-Encoding "";
            sub_filter 'href="/web' 'href="/odoo/web';
            sub_filter 'src="/web' 'src="/odoo/web';
            sub_filter 'action="/web' 'action="/odoo/web';
            sub_filter_once off;

            proxy_cookie_path / /odoo/;
            proxy_redirect / /odoo/;
        }

        # -------------------------------
        # Orthanc
        # -------------------------------
        location /orthanc-container/ {
            rewrite ^/orthanc-container/(.*)$ /$1 break;
            proxy_pass http://orthanc_server;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$http_host;proto=$scheme";
        }

        location /orthanc/ {
            return 301 /orthanc-container/;
        }

        # -------------------------------
        # OpenELIS Backend API
        # -------------------------------
        location = /api/OpenELIS-Global/openelis/ {
            return 302 /api/OpenELIS-Global/MasterListsPage;
        }

        location ~ ^/api/OpenELIS-Global/(.*)$ {
            rewrite ^/api/OpenELIS-Global/(.*)$ /OpenELIS-Global/$1 break;
            proxy_pass http://openelis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            proxy_redirect /OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect https://$host:8443/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect http://$host:8080/OpenELIS-Global/ /api/OpenELIS-Global/;
        }

        # Legacy direct backend path
        location ~ ^/OpenELIS-Global/(.*)$ {
            proxy_pass http://openelis_backend/OpenELIS-Global/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global/ /OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/ /OpenELIS-Global/;
        }

        # -------------------------------
        # OpenELIS Frontend (React SPA)
        # -------------------------------
        location = /openelis {
            return 301 /openelis/;
        }

        # Strip /openelis/ prefix before proxying to the frontend container.
        # The React app is built with PUBLIC_URL=/openelis, so its internal nginx
        # expects to serve assets from / (the prefix is stripped here at the gateway).
        location /openelis/ {
            rewrite ^/openelis/(.*)$ /$1 break;
            proxy_pass http://openelis_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # -------------------------------
        # DHIS2 / Federal HMIS Integration
        # -------------------------------
        location = /dhis2 {
            return 301 /dhis2/;
        }

        location /dhis2/ {
            set $dhis2_backend "nidan-dhis2:5000";
            rewrite ^/dhis2/(.*)$ /$1 break;
            proxy_pass http://$dhis2_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dhis2;
            proxy_redirect off;
        }

        # Default fallback - MUST be last
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}