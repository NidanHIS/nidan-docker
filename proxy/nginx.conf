worker_processes auto;
events {
    worker_connections 1024;
}

# KC-13-02: nginx writes the whole request line (query string included) into error-level messages such as a 502's
# "could not be resolved ... request: GET /openmrs/...?q=<name>", and docker logs keep them. Only crit and worse
# here; every 502 stays visible in the access log with its upstream status and address, path without the query.
error_log stderr crit;

http {
    include mime.types;
    server_tokens off;
    map_hash_bucket_size 128;   # staff-groups.map has exact keys of ~70 chars (GET:/staff-api/groups/<uuid>/members)   # KC-12-01: no nginx version in Server header or error pages
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;
    # websocket upgrade (Odoo's POS/bus on :8069)
    map $http_upgrade $nidan_connection_upgrade { default upgrade; "" close; }
    include /etc/nginx/auth/http.conf;
    # KC-56-06: redirects nginx makes itself carry no host, and only this site's own host names are served
    # (allowed-hosts.conf is written by docker-entrypoint.sh from GATEWAY_DOMAIN + GATEWAY_CERT_SANS).
    absolute_redirect off;
    include /etc/nginx/allowed-hosts.conf;          # central login (KC-10); empty when NIDAN_SSO_ENABLED=false
    # KC-10-09: plain http on a TLS port (nginx 497) is sent to https on the same port, to a known host only: an
    # unknown Host gets GATEWAY_DOMAIN, so this can never redirect off the gateway (KC-56-06).
    map $nidan_host_ok $nidan_redirect_host { 1 $host; default "${GATEWAY_DOMAIN}"; }

    sendfile on;
    keepalive_timeout 65;
    # Upstreams are containers on the same Docker networks: a connection takes milliseconds. Fail fast when one is down
    # (nginx keeps a stopped container's address for up to 30 s, resolver valid=30s) so people get the error page
    # in seconds, not after the default 60 s (KC-10-11). Read/send timeouts are unchanged.
    proxy_connect_timeout 5s;

    # Static assets are served uncompressed without this: the OpenELIS SPA bundle
    # alone is 7.4 MB raw / 1.8 MB gzipped. gzip_proxied any → compress even though
    # these responses come back from an upstream (openelis-frontend) with no
    # Content-Encoding of its own.
    gzip on;
    gzip_vary on;
    # 1 KiB
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_http_version 1.0;
    gzip_types  font/eot
                font/otf
                font/ttf
                image/svg+xml
                # text/html is always gzipped by nginx; listing it warns "duplicate MIME type"
                text/css
                text/javascript
                text/plain
                text/xml
                application/atom+xml
                application/geo+json
                application/importmap+json
                application/javascript
                application/x-javascript
                application/json
                application/ld+json
                application/fhir+json
                application/fhir+xml
                application/manifest+json
                application/rdf+xml
                application/rss+xml
                application/xhtml+xml
                application/xml;

    # Which app a request belongs to, for the access log (spec section 4 rule 16 / A2). From the path, so it
    # is logged with central login on or off. From the client's path, not $uri, which is /502.html after an error page.
    map $nidan_log_path $nidan_log_app {
        ~^/openmrs                         openmrs;
        ~^/(api/)?OpenELIS-Global|^/openelis  openelis;
        ~^/(ohif|dicom-web|wado|orthanc)   orthanc;
        ~^/superset                        superset;
        ~^/dhis2                           dhis2;
        ~^/(cis|dead-letters|api/dead-letters)  cis;
        ~^/staff                           staff;
        ~^/oauth2                          login;
        default                            -;
    }

    # KC-13-01: method + path only; the query string can carry patient names/ids (?q=...).
    # user = Keycloak username from the auth check ("-" with central login off or before login).
    # The path as the client sent it, query cut off: $uri becomes /502.html after an error_page redirect, which
    # hid which app failed once error_log went to crit (KC-13-02).
    map $request_uri $nidan_log_path { "~^(?<p>[^?]*)" $p; default "-"; }
    log_format debug_log '[$time_local] "$request_method $nidan_log_path $server_protocol" status:$status '
                         'user:$nidan_user app:$nidan_log_app '
                         'up_status:$upstream_status up_addr:$upstream_addr '
                         'rt=$request_time urt=$upstream_response_time '
                         'forwarded_proto:$http_x_forwarded_proto '
                         'sent_proto:$sent_http_x_forwarded_proto';

    access_log /var/log/nidan/access.log debug_log;   # own volume, 0600, kept 365 days (KC-13-03)
        # ----------------------------------------------------------------
    # HTTP -> HTTPS redirect for real domain names (handled below)
    # ----------------------------------------------------------------
    
    # ----------------------------------------------------------------
    # Port 8443 — catches the hardcoded https://localhost:8443/OpenELIS-Global/*
    # calls baked into the pre-built frontend image's config.json.
    # nginx terminates TLS here and proxies to openelis:8080 over plain HTTP.
    # This is the ONLY way to fix CORS without rebuilding the frontend image.
    # ----------------------------------------------------------------
    server {

        # KC-56-08: reject path tricks that nginx and the upstream (Tomcat ..; , encoded slashes)
        # would resolve differently. Path only: query strings may legitimately contain //.
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//)") {
            return 400;
        }
        listen 8443 ssl;
        error_page 497 =301 https://$nidan_redirect_host:$server_port$request_uri;   # KC-10-09
        include /etc/nginx/hsts.conf;           # KC-12-02 (locations without their own add_header)
        include /etc/nginx/auth/server.conf;    # role checks + /oauth2/* (KC-10); empty when SSO is off
        set $nidan_user "-";                     # overwritten by the auth check (gate-*.conf)
        server_name localhost 127.0.0.1 _;
        if ($nidan_host_ok = 0) {                # KC-56-06: unknown Host never reaches an app or a redirect
            return 421;
        }

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" (KC-12-03): forward-secret AEAD only, no CBC/SHA1 suites.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache   shared:NidanTLS:10m;
        ssl_session_timeout 1d;

        # TLS-only server: mark every upstream cookie Secure so a session cookie never leaves over HTTP.
        # Inherited by all locations here (none set their own proxy_cookie_flags).
        proxy_cookie_flags ~ secure;

        # Friendly 502 error page
        error_page 502 503 504 /502.html;
        location = /502.html {
            include /etc/nginx/gateway-page-headers.conf;
            root /usr/share/nginx/html;
            internal;
        }

        # Proxy all OpenELIS-Global paths directly to the backend
        location /OpenELIS-Global/ {
            include /etc/nginx/auth/gate-app-openelis.conf;
            set $openelis_backend "openelis:8080";
            proxy_pass http://$openelis_backend/OpenELIS-Global/;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Host $host;

            # Remap session cookies from backend context to gateway context
            proxy_cookie_path /OpenELIS-Global/ /OpenELIS-Global/;
            proxy_redirect http://$host:8080/OpenELIS-Global/ https://$host:8443/OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/LoginPage https://$host/openelis/login;
        }

        # Catch-all: unknown paths on :8443 are 404, never nginx's default root (KC-10-03).
        location / {
            return 404;
        }
    }

    # ----------------------------------------------------------------
    # Staff page admin API allow-list (backlog KC-20, D33/D56; contract proxy/staff-api.allow.yaml).
    # Method + decoded path -> Keycloak admin path rebuilt from captured ids only. "" = refused (403).
    # ----------------------------------------------------------------
    map "$request_method:$uri" $staff_api_target {
        default "";
        # Job-group routes for this site's /staff/* groups only, generated by scripts/staff-config.py (KC-21-09):
        # adding anyone to an admin group or app-superusers is 403 here, whatever Keycloak's permissions say.
        # The entrypoint writes an empty file when the site has none: no job changes at all (fail closed).
        include /etc/nginx/staff/staff-groups.map;
        "~^POST:/staff-api/users$"                                 /users;
        "~^GET:/staff-api/users/(?<u>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"                       /users/$u;
        "~^PUT:/staff-api/users/(?<u>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"                       /users/$u;
        "~^PUT:/staff-api/users/(?<u>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/reset-password$"        /users/$u/reset-password;
        "~^POST:/staff-api/users/(?<u>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/logout$"               /users/$u/logout;
        "~^GET:/staff-api/users/(?<u>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/groups$"                /users/$u/groups;
        "~^GET:/staff-api/events$"                                 /events;
        "~^GET:/staff-api/admin-events$"                           /admin-events;
    }

    # ----------------------------------------------------------------
    # Port 80: certificate renewal (ACME) and a redirect to https, nothing else (KC-47)
    # ----------------------------------------------------------------
    server {

        # KC-56-08: reject path tricks that nginx and the upstream (Tomcat ..; , encoded slashes)
        # would resolve differently. Path only: query strings may legitimately contain //.
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//)") {
            return 400;
        }
        listen 80 default_server;  # the only :80 server
        server_name _;
        if ($nidan_host_ok = 0) {                # KC-56-06: unknown Host never reaches an app or a redirect
            return 421;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------
    # HTTPS server (production / real domain)
    # ----------------------------------------------------------------
    server {

        # KC-56-08: reject path tricks that nginx and the upstream (Tomcat ..; , encoded slashes)
        # would resolve differently. Path only: query strings may legitimately contain //.
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//)") {
            return 400;
        }
        listen 443 ssl;
        error_page 497 =301 https://$nidan_redirect_host:$server_port$request_uri;   # KC-10-09
        include /etc/nginx/hsts.conf;           # KC-12-02 (locations without their own add_header)
        include /etc/nginx/auth/server.conf;    # role checks + /oauth2/* (KC-10); empty when SSO is off
        set $nidan_user "-";                     # overwritten by the auth check (gate-*.conf)
        server_name _;
        if ($nidan_host_ok = 0) {                # KC-56-06: unknown Host never reaches an app or a redirect
            return 421;
        }

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" (KC-12-03): forward-secret AEAD only, no CBC/SHA1 suites.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache   shared:NidanTLS:10m;
        ssl_session_timeout 1d;

        # TLS-only server: mark every upstream cookie Secure so a session cookie never leaves over HTTP.
        # Inherited by all locations here (none set their own proxy_cookie_flags).
        proxy_cookie_flags ~ secure;

        # Friendly 502 error page
        error_page 502 503 504 /502.html;
        location = /502.html {
            include /etc/nginx/gateway-page-headers.conf;
            root /usr/share/nginx/html;
            internal;
        }



        # OpenMRS Backend API (must come before /openmrs/ to match first)


        # OpenMRS Backend pages
        location ~ ^/openmrs/(initialsetup|module|login|logout|admin|legacy) {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_backend "openmrs-backend:8080";
            proxy_pass http://$openmrs_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Frontend (SPA)
        location = /openmrs/spa/config.json {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_frontend "openmrs-frontend:80";
            rewrite ^/openmrs/spa/config\.json$ /config-core_demo.json break;
            proxy_pass http://$openmrs_frontend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location = /openmrs/spa {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            return 301 /openmrs/spa/;
        }

        location /openmrs/spa/ {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_frontend "openmrs-frontend:80";
            rewrite ^/openmrs/spa/(.*)$ /$1 break;
            proxy_pass http://$openmrs_frontend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # OpenMRS backend entrypoints (legacy UI at /openmrs, API at /openmrs/ws, SPA at /openmrs/spa)
        location = /openmrs {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_backend "openmrs-backend:8080";
            proxy_pass http://$openmrs_backend/openmrs;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /openmrs/ {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_backend "openmrs-backend:8080";
            proxy_pass http://$openmrs_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMRS Backend catch-all (must come after more specific locations)
        location /openmrs/ {
            include /etc/nginx/auth/gate-app-openmrs.conf;
            set $openmrs_backend "openmrs-backend:8080";
            proxy_pass http://$openmrs_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Odoo: access directly at localhost:8069. /odoo-health/ kept for dashboard status check.
        # Orthanc
        # -------------------------------
        location /orthanc-container/ {
            include /etc/nginx/auth/gate-orthanc-admin.conf;
            set $orthanc_server "orthanc:8042";
            rewrite ^/orthanc-container/(.*)$ /$1 break;
            proxy_pass http://$orthanc_server;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$host;proto=$scheme";
        }

        location /orthanc/ {
            include /etc/nginx/auth/gate-orthanc-admin.conf;
            return 301 /orthanc-container/;
        }

        location = /ohif {
            include /etc/nginx/auth/gate-app-orthanc.conf;
            return 301 /ohif/;
        }

        location /ohif/ {
            include /etc/nginx/auth/gate-app-orthanc.conf;
            limit_except GET HEAD OPTIONS { deny all; }   # viewers read only: no STOW, no DELETE (KC-30-03)
            set $orthanc_server "orthanc:8042";
            proxy_pass http://$orthanc_server;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$host;proto=$scheme";
        }

        location /dicom-web/ {
            include /etc/nginx/auth/gate-app-orthanc.conf;
            limit_except GET HEAD OPTIONS { deny all; }   # viewers read only: no STOW, no DELETE (KC-30-03)
            set $orthanc_server "orthanc:8042";
            proxy_pass http://$orthanc_server;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$host;proto=$scheme";
        }

        location /wado/ {
            include /etc/nginx/auth/gate-app-orthanc.conf;
            limit_except GET HEAD OPTIONS { deny all; }   # viewers read only: no STOW, no DELETE (KC-30-03)
            set $orthanc_server "orthanc:8042";
            proxy_pass http://$orthanc_server;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$host;proto=$scheme";
        }

        # -------------------------------
        # OpenELIS Backend API
        # -------------------------------
        location = /api/OpenELIS-Global/openelis/ {
            include /etc/nginx/auth/gate-app-openelis.conf;
            return 302 /api/OpenELIS-Global/MasterListsPage;
        }

        # App logouts (spec section 4 rule 7): the app ends its own session, then with central login on its
        # redirect goes to /oauth2/sign_out, which also ends the Keycloak session (oauth2-proxy
        # backend_logout_url). Same proxy settings as the app's main location below; keep them in sync.
        location = /api/OpenELIS-Global/Logout {
            include /etc/nginx/auth/gate-app-openelis.conf;
            include /etc/nginx/auth/logout-chain.conf;
            set $openelis_backend "openelis:8080";
            rewrite ^/api/OpenELIS-Global/(.*)$ /OpenELIS-Global/$1 break;
            proxy_pass http://$openelis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            proxy_redirect /OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect /api/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://$host/OpenELIS-Global/LoginPage /openelis/login;
        }
        location = /dhis2/auth/logout {
            include /etc/nginx/auth/gate-app-dhis2.conf;
            include /etc/nginx/auth/logout-chain.conf;
            set $dhis2_backend "nidan-dhis2:5000";
            rewrite ^/dhis2/(.*)$ /$1 break;
            proxy_pass http://$dhis2_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dhis2;
        }
        location = /superset/logout/ {
            include /etc/nginx/auth/gate-app-superset.conf;
            include /etc/nginx/auth/logout-chain.conf;
            set $superset_backend "superset:8088";
            proxy_pass http://$superset_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Script-Name /superset;
        }

        location ~ ^/api/OpenELIS-Global/(.*)$ {
            include /etc/nginx/auth/gate-app-openelis.conf;
            set $openelis_backend "openelis:8080";
            rewrite ^/api/OpenELIS-Global/(.*)$ /OpenELIS-Global/$1 break;
            proxy_pass http://$openelis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            proxy_redirect /OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect https://openelis/ /api/OpenELIS-Global/;
            proxy_redirect http://openelis/ /api/OpenELIS-Global/;
            proxy_redirect https://$host:8443/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect http://$host:8080/OpenELIS-Global/ /api/OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect /api/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://$host/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://localhost/OpenELIS-Global/LoginPage /openelis/login;
            proxy_redirect https://localhost:8443/OpenELIS-Global/LoginPage /openelis/login;
        }

        # Legacy direct backend path
        location ~ ^/OpenELIS-Global/(.*)$ {
            include /etc/nginx/auth/gate-app-openelis.conf;
            set $openelis_backend "openelis:8080";
            proxy_pass http://$openelis_backend/OpenELIS-Global/$1$is_args$args;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cookie_path /OpenELIS-Global/ /OpenELIS-Global/;
            proxy_redirect /OpenELIS-Global/ /OpenELIS-Global/;
        }

        # -------------------------------
        # OpenELIS Frontend (React SPA)
        # -------------------------------
        location = /openelis {
            include /etc/nginx/auth/gate-app-openelis.conf;
            return 301 /openelis/;
        }

        # Strip /openelis/ prefix before proxying to the frontend container.
        # The React app is built with PUBLIC_URL=/openelis, so its internal nginx
        # expects to serve assets from / (the prefix is stripped here at the gateway).
        location /openelis/ {
            include /etc/nginx/auth/gate-app-openelis.conf;
            set $openelis_frontend "openelis-frontend:80";
            rewrite ^/openelis/(.*)$ /$1 break;
            proxy_pass http://$openelis_frontend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # -------------------------------
        # DHIS2 / Federal HMIS Integration
        # -------------------------------
        location = /dhis2 {
            include /etc/nginx/auth/gate-app-dhis2.conf;
            return 301 /dhis2/;
        }

        location /dhis2/ {
            include /etc/nginx/auth/gate-app-dhis2.conf;
            set $dhis2_backend "nidan-dhis2:5000";
            rewrite ^/dhis2/(.*)$ /$1 break;
            proxy_pass http://$dhis2_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dhis2;
            proxy_redirect off;
        }

        # -------------------------------
        # CIS Middleware UI
        # -------------------------------
        location = /cis {
            include /etc/nginx/auth/gate-cis-admin.conf;
            return 301 /dead-letters/index.html;
        }

        location = /cis/ {
            include /etc/nginx/auth/gate-cis-admin.conf;
            return 301 /dead-letters/index.html;
        }

        # Only the dead-letter UI and the launcher's health probe are exposed under /cis/. Everything else
        # on CIS (OpenELIS/Orthanc webhooks, actuator, internal APIs) is internal-network only (backlog KC-53).
        location ^~ /cis/dead-letters/ {
            include /etc/nginx/auth/gate-cis-admin.conf;
            set $cis_backend "nidan-cis:8081";
            rewrite ^/cis/(.*)$ /$1 break;
            proxy_pass http://$cis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cis;
            proxy_redirect off;
        }

        location = /cis/actuator/health {
            set $cis_backend "nidan-cis:8081";
            rewrite ^ /actuator/health? break;   # fixed upstream path, client query string dropped (KC-14-02)
            proxy_pass http://$cis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cis;
            proxy_redirect off;
        }

        location /cis/ {
            return 404;
        }

        location /dead-letters {
            include /etc/nginx/auth/gate-cis-admin.conf;
            set $cis_backend "nidan-cis:8081";
            proxy_pass http://$cis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /api/dead-letters {
            include /etc/nginx/auth/gate-cis-admin.conf;
            set $cis_backend "nidan-cis:8081";
            rewrite ^/api/dead-letters/?$ /api/dead-letters break;
            proxy_pass http://$cis_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Superset
        location = /superset {
            include /etc/nginx/auth/gate-app-superset.conf;
            return 301 /superset/;
        }

        location /superset/ {
            include /etc/nginx/auth/gate-app-superset.conf;
            set $superset_backend "superset:8088";

            # Pass full path - Superset expects /superset/welcome/, etc.
            proxy_pass http://$superset_backend;
            include /etc/nginx/client-identity-headers.conf;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Script-Name /superset;

            proxy_redirect off;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 5s;     # connecting is fast; long queries are the read timeout
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # -------------------------------
        # Dashboard Proxy Health Checks
        # -------------------------------
        # Local proxy to check Odoo health bypassing CORS
        location = /odoo-health/ {
            set $odoo_backend "odoo:8069";
            proxy_pass http://$odoo_backend/web/health;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host;
        }

        # Hidden Health Endpoint for Orthanc to prevent Basic Auth popups
        # Status only (KC-14-02): /system's body names the Orthanc version and DICOM AET, so it is fetched as an
        # auth_request subrequest whose body never reaches the client. Up = 204 (or 401 when Orthanc wants
        # credentials); Orthanc down = 502, which is what the launcher reads as an outage.
        location = /auth-ping/orthanc {
            auth_request /_ping_orthanc;
            error_page 500 = @orthanc_ping_down;
            try_files /__status_only__ =204;
        }
        location = /_ping_orthanc {
            internal;
            set $orthanc_server "orthanc:8042";
            proxy_pass http://$orthanc_server/system;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            include /etc/nginx/client-identity-headers.conf;
            proxy_hide_header WWW-Authenticate;
            proxy_set_header Host $host;
        }
        location @orthanc_ping_down { return 502; }

        # Launcher and its static files (KC-15). Exact paths only; everything else is 404 (KC-10-03).
        location = / {
            include /etc/nginx/launcher-page-headers.conf;
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
        location = /not-allowed.html {
            include /etc/nginx/launcher-page-headers.conf;
            root /usr/share/nginx/html;
        }
        location = /outage.html {
            include /etc/nginx/launcher-page-headers.conf;
            root /usr/share/nginx/html;
        }
        location /assets/ {
            include /etc/nginx/gateway-page-headers.conf;
            root /usr/share/nginx/html;
            try_files $uri =404;
        }
        location = /nidan-logo.png    { root /usr/share/nginx/html; }
        location = /trigonal-logo.png { root /usr/share/nginx/html; }

        # Catch-all: an unknown path never reaches an upstream or the launcher (KC-10-03).
        location / {
            return 404;
        }
    }

    # ----------------------------------------------------------------
    # Keycloak back-channel for apps (backlog KC-43). Internal only: port 8099 is never published, and the
    # gateway is the only service on both the app network and auth-net. Apps fetch tokens, signing keys
    # and userinfo here (http://gateway:8099/auth/realms/nidan/...); nothing else of Keycloak is reachable.
    # ----------------------------------------------------------------
    server {
        listen 8099;
        server_name _;
        access_log /var/log/nidan/access.log debug_log;   # own volume, 0600, kept 365 days (KC-13-03)

        # Container healthcheck (KC-47-03): this listener is never published, so the probe is invisible from the LAN
        location = /gateway-health {
            access_log off;
            return 204;
        }

        # KC-56-08: path tricks refused before matching, as on every other server.
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//)") {
            return 400;
        }

        location ~ ^/auth/realms/nidan/protocol/openid-connect/(token|certs|userinfo)$ {
            set $keycloak_backend "keycloak:8080";
            proxy_pass http://$keycloak_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Keycloak -> Odoo back-channel logout (KC-37-08). Keycloak sits on auth-net only, so it reaches Odoo
        # through this relay; Odoo verifies the signed logout token, so a forged POST changes nothing.
        location = /backchannel-logout/odoo {
            limit_except POST { deny all; }
            set $odoo_backend "odoo:8069";
            proxy_pass http://$odoo_backend/auth_oauth/backchannel_logout;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host odoo;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            return 404;
        }
    }

    # ----------------------------------------------------------------
    # :8069 = Odoo through the gateway (decision 2026-10-10, spec D5): TLS + the app-odoo gate. Odoo itself is no
    # longer published; services call it on odoo:8069 inside the network (paywall, OIS, portal).
    # ----------------------------------------------------------------
    server {
        listen 8069 ssl;
        error_page 497 =301 https://$nidan_redirect_host:$server_port$request_uri;   # KC-10-09
        include /etc/nginx/hsts.conf;
        include /etc/nginx/auth/server.conf;    # role checks + /oauth2/* (KC-10); empty when SSO is off
        set $nidan_user "-";
        server_name _;
        if ($nidan_host_ok = 0) {                # KC-56-06
            return 421;
        }

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache   shared:NidanTLS:10m;
        proxy_cookie_flags ~ secure;
        client_max_body_size 100m;               # attachments, POS image uploads

        # KC-56-08: path tricks Odoo (werkzeug) and nginx could resolve differently
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//)") {
            return 400;
        }

        error_page 502 503 504 /502.html;
        location = /502.html {
            include /etc/nginx/gateway-page-headers.conf;
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            include /etc/nginx/auth/gate-app-odoo.conf;
            set $odoo_backend "odoo:8069";
            proxy_pass http://$odoo_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_read_timeout 720s;             # long reports / POS sync
        }

        # POS / bus websocket (KC-10-08): gated at the upgrade like every page
        location = /websocket {
            include /etc/nginx/auth/gate-app-odoo.conf;
            set $odoo_backend "odoo:8069";
            proxy_pass http://$odoo_backend;
            include /etc/nginx/client-identity-headers.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $nidan_connection_upgrade;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_read_timeout 3600s;
        }

        # Keycloak lives on :9443 only (D1, KC-07-02): its paths are 404 here, not the app gate's 401
        location ^~ /auth/ {
            return 404;
        }

        # Service APIs (/api/nidan/*, /api/tenant/*), the database manager and RPC are internal only (KC-53-02):
        # 404 here, for everyone, signed in or not.
        location ~ ^/(api/|web/database/|xmlrpc/|jsonrpc) {
            return 404;
        }

        # The payer's phone has no hospital session: these pages check their own link token (consteq).
        location = /pos_esewa_qr/pay {
            limit_except GET { deny all; }
            include /etc/nginx/odoo-public-proxy.conf;
        }
        location = /pos_esewa_qr/return {
            include /etc/nginx/odoo-public-proxy.conf;
        }
        location ~ ^/pos_khalti_qr/return/[0-9]+/[A-Za-z0-9_-]+$ {
            include /etc/nginx/odoo-public-proxy.conf;
        }
    }

    # ----------------------------------------------------------------
    # :9443 = Keycloak's public origin (decision D1) + the Staff page (backlog KC-20, D49).
    # ----------------------------------------------------------------
    server {
        listen 9443 ssl;
        error_page 497 =301 https://$nidan_redirect_host:$server_port$request_uri;   # KC-10-09
        include /etc/nginx/hsts.conf;           # KC-12-02 (locations without their own add_header)
        include /etc/nginx/auth/server.conf;    # role checks + /oauth2/* (KC-10); empty when SSO is off
        set $nidan_user "-";                     # overwritten by the auth check (gate-*.conf)
        server_name _;
        if ($nidan_host_ok = 0) {                # KC-56-06: unknown Host never reaches an app or a redirect
            return 421;
        }

        ssl_certificate     /etc/letsencrypt/live/${GATEWAY_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${GATEWAY_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache   shared:NidanTLS:10m;
        proxy_cookie_flags ~ secure;

        # KC-56-08 + D56: path tricks and any ';' in the raw URI are refused before matching.
        if ($request_uri ~* "^[^?]*(/\.\.;|%2e%2e|%2f|%5c|//|;)") {
            return 400;
        }

        include /etc/nginx/auth/keycloak-public.conf;   # Keycloak's public origin (D1); empty when SSO is off

        location = /staff {
            include /etc/nginx/auth/gate-hospital-admin.conf;
            return 301 /staff/;
        }

        location /staff/ {
            include /etc/nginx/auth/gate-hospital-admin.conf;
            root /usr/share/nginx/html;
            try_files $uri /staff/index.html;
            include /etc/nginx/launcher-page-headers.conf;
        }

        location /staff-api/ {
            include /etc/nginx/auth/gate-hospital-admin.conf;
            # CSRF guard on EVERY method (KC-20-04): the custom header forces a CORS preflight from any
            # other origin, Sec-Fetch-Site says the browser made it from this origin, and Origin (sent on
            # writes) must be this origin when present.
            if ($http_x_nidan_staff != "1") {
                return 403;
            }
            if ($http_sec_fetch_site != "same-origin") {
                return 403;
            }
            set $staff_origin_ok "1";
            if ($http_origin != "") {
                set $staff_origin_ok "0";
            }
            if ($http_origin = "https://$http_host") {
                set $staff_origin_ok "1";
            }
            if ($staff_origin_ok = "0") {
                return 403;
            }
            if ($staff_api_target = "") {
                return 403;
            }
            set $keycloak_backend "keycloak:8080";
            proxy_pass http://$keycloak_backend/auth/admin/realms/nidan$staff_api_target$is_args$args;
            include /etc/nginx/client-identity-headers.conf;
            # never forward a client-supplied credential; KC-10 replaces this with the admin's own token
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Host keycloak:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Keycloak's own CORS headers must not reach the browser (KC-20-04)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Expose-Headers;
        }

        location / {
            return 404;
        }
    }
}
