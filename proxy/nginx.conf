worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    sendfile on;
    keepalive_timeout 65;

    upstream openmrs_frontend {
        server openmrs-frontend:80;
    }

    upstream openmrs_backend {
        server openmrs-backend:8080;
    }

    upstream keycloak_server {
        server keycloak:8080;
    }

    upstream odoo_server {
        server odoo:8069;
    }

    upstream orthanc_server {
        server orthanc:8042;
    }

    upstream openelis_backend {
        server openelis:8080;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS SERVER
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # OPENMRS - Redirect /openmrs to /openmrs/spa/
        location = /openmrs {
            return 301 $scheme://$host/openmrs/spa/;
        }
        
        location = /openmrs/ {
            return 301 $scheme://$host/openmrs/spa/;
        }

        # OPENMRS - SPA Frontend (must come before backend routes)
        location /openmrs/spa/ {
            proxy_pass http://openmrs_frontend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
            proxy_redirect off;
        }

        # OPENMRS - Backend API and resources
        location /openmrs/ {
            proxy_pass http://openmrs_backend/openmrs/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
            proxy_redirect off;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # KEYCLOAK
        location /auth/ {
            proxy_pass http://keycloak_server/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ODOO
        location = /odoo {
            return 301 /odoo/web;
        }

        location /odoo/ {
            proxy_pass http://odoo_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /odoo/;
        }

        # ORTHANC
        location /orthanc-container/ {
            rewrite ^/orthanc-container/(.*)$ /$1 break;
            proxy_pass http://orthanc_server;
            proxy_set_header Host $host;
        }

        location /orthanc {
            return 301 /orthanc-container/;
        }

        # OPENELIS
        location /openelis/ {
            proxy_pass http://openelis_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LANDING PAGE (MUST be last)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}