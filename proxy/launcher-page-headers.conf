# Launcher page only (backlog KC-12-01 / KC-15): same headers as gateway-page-headers.conf plus a
# strict CSP, possible now that the launcher has no inline script or style. The entrypoint widens
# script-src only when GATEWAY_ANALYTICS_ID is set (public demo).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
include /etc/nginx/hsts.conf;          # HSTS only for a public-cert domain (KC-12-02); empty otherwise
