# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Login and logout end every app session too (rule 6, D13): no app keeps a session from a previous user.
add_header Set-Cookie "session_id=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
add_header Set-Cookie "JSESSIONID=; Path=/openmrs; Max-Age=0; Secure; HttpOnly" always;
add_header Set-Cookie "JSESSIONID=; Path=/OpenELIS-Global; Max-Age=0; Secure; HttpOnly" always;
add_header Set-Cookie "JSESSIONID=; Path=/api/OpenELIS-Global; Max-Age=0; Secure; HttpOnly" always;
add_header Set-Cookie "superset_session=; Path=/superset; Max-Age=0; Secure; HttpOnly" always;
# DHIS2 reporting app (Flask): cookie path comes from APPLICATION_ROOT ("/"), not the /dhis2 prefix; both, to be sure.
add_header Set-Cookie "nidan_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
add_header Set-Cookie "nidan_session=; Path=/dhis2; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
include /etc/nginx/hsts.conf;          # HSTS only for a public-cert domain (KC-12-02); empty otherwise
