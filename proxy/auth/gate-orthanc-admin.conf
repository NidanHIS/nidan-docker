# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Gate: role:nidan-gateway:orthanc-admin. Included as the first line of every location the contract gates with it.
auth_request /_auth_orthanc-admin;
auth_request_set $nidan_auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $nidan_auth_cookie;
auth_request_set $nidan_user $upstream_http_x_auth_request_user;   # access log (rule 16)          # refreshed session cookie reaches the browser (rule 3)
set $nidan_app orthanc;                               # fixed key for /not-allowed.html, never from the request
error_page 401 = @nidan_login;
error_page 403 = @nidan_forbidden;
error_page 500 = @nidan_outage;                     # auth subrequest failed: Keycloak / oauth2-proxy down
error_page 502 503 504 /502.html;                   # app down (a location-level error_page drops the server's)
include /etc/nginx/orthanc-auth-admin.conf;              # the gateway's Basic for Orthanc, never the browser's (KC-30-06)
include /etc/nginx/hsts.conf;          # HSTS only for a public-cert domain (KC-12-02); empty otherwise
