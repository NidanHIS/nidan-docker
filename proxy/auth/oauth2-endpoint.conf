# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Proxy to oauth2-proxy for /oauth2/start|callback|sign_out|userinfo. Only the gateway reaches it (auth-net).
proxy_pass http://$nidan_oauth2;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Uri $request_uri;
proxy_set_header X-Forwarded-For $remote_addr;
# Keycloak's login page in the launcher's language (KC-18-01): append ui_locales to oauth2-proxy's redirect to it.
proxy_redirect ~^(?<nidan_kc_login>[^?]+/protocol/openid-connect/auth\?.+)$ $nidan_kc_login$nidan_ui_locales;
