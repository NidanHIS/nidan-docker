# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Headers for the internal /_auth_<role> subrequest to oauth2-proxy.
proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Uri $request_uri;
proxy_set_header X-Forwarded-For $remote_addr;
