# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# http-level: upstream name, page-vs-API detection, header room for role-heavy cookies (rule 12).
map $host $nidan_oauth2 { default "oauth2-proxy:4180"; }
# Sec-Fetch-Mode=navigate, or (old browsers) an Accept that asks for HTML = a page.
map "$http_sec_fetch_mode|$http_accept" $nidan_is_page {
    "~^navigate\|"      1;
    "~^\|.*text/html"   1;
    default             0;
}
# ponytail: rd is the path only up to the first "&" of the query (nginx has no urlencode); oauth2-proxy
# still validates it against the gateway domain. Upgrade: njs encodeURIComponent if deep links need it.
map $request_uri $nidan_rd { "~^(?<p>[^&]*)" $p; default /; }
large_client_header_buffers 4 32k;
# ...and room for big RESPONSE headers from oauth2-proxy: with many job roles its session cookie is split into several
# Set-Cookie headers (_oauth2_proxy_0, _1, ...) that overflow nginx's default 4-8k proxy buffer -> 502 at /oauth2/callback
# and on every cookie refresh through auth_request (found live with a person in every job, KC-10-10).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
# KC-18-01: the launcher's language (cookie nidan_locale) reaches Keycloak's login page as ui_locales. Only the
# supported values pass; anything else in the cookie is ignored.
map $cookie_nidan_locale $nidan_ui_locales { ne "&ui_locales=ne"; en "&ui_locales=en"; default ""; }
# KC-38-05: with central login on, OpenELIS's own password login is refused at the gateway (Basic is
# already stripped by every gate). Tomcat also accepts ";params" and a trailing "/", so match those too.
map $uri $nidan_openelis_password_login {
    "~*/ValidateLogin(/|;|$)"  1;
    default                    0;
}
# KC-12-07: Keycloak's public auth/token and login forms, rate-limited per client IP (keycloak-public.conf). The zones
# are written by docker-entrypoint.sh: KC_LOGIN_RATE_PER_MIN (default 10), KC_LOGIN_RATE_EXEMPT (CIDRs, default none).
include /etc/nginx/kc-rate.conf;
