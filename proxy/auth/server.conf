location = /_auth_hospital-admin {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:hospital-admin;
}

# Pages go to login / not-allowed / outage; APIs get a bare status (rule 4, D24).
location @nidan_login {
    if ($nidan_is_page) { return 302 /oauth2/start?rd=$nidan_rd; }
    return 401;
}
location @nidan_forbidden {
    if ($nidan_is_page) { return 302 /not-allowed.html?app=$nidan_app; }
    return 403;
}
location @nidan_outage {
    if ($nidan_is_page) { return 302 /outage.html?rd=$nidan_rd; }
    return 503;
}

# Public oauth2-proxy endpoints, exact matches only (rule 10). /oauth2/auth is internal-only.
location = /oauth2/start    { include /etc/nginx/auth/oauth2-endpoint.conf; }
location = /oauth2/userinfo { include /etc/nginx/auth/oauth2-endpoint.conf; }
location = /oauth2/callback { include /etc/nginx/auth/oauth2-endpoint.conf; include /etc/nginx/auth/expire-app-cookies.conf; }
location = /oauth2/sign_out { include /etc/nginx/auth/oauth2-endpoint.conf; include /etc/nginx/auth/expire-app-cookies.conf; }
location = /oauth2/auth     { return 404; }
