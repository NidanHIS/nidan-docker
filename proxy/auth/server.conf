# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Per server (443, 8443, 9443): role checks, login/forbidden/outage handlers, the four public oauth2 paths.

# One internal check per role (rule 2): auth_request takes no query string, so the group is in the URI.
location = /_auth_app-openmrs {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:app-openmrs;
}
location = /_auth_app-openelis {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:app-openelis;
}
location = /_auth_app-odoo {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:app-odoo;
}
location = /_auth_app-orthanc {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:app-orthanc;
}
location = /_auth_orthanc-admin {
    internal;
    include /etc/nginx/auth/subrequest.conf;
    proxy_pass http://$nidan_oauth2/oauth2/auth?allowed_groups=role:nidan-gateway:orthanc-admin;
}
location = /_auth_app-superset {
