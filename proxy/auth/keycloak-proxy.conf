# One proxied Keycloak location on its public origin (keycloak-public.conf). The client's X-Forwarded-For is
# replaced, never appended: Keycloak trusts these headers only from the gateway (KC_PROXY_TRUSTED_ADDRESSES), so its
# events record the real client address, not one the client typed (KC-56-05).
set $keycloak_backend "keycloak:8080";
proxy_pass http://$keycloak_backend;
include /etc/nginx/client-identity-headers.conf;
proxy_set_header Host $host:$server_port;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
