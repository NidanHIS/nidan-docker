# Keycloak's browser-facing origin (decision D1: the :9443 server, shared with the Staff page; routes.yaml server
# "keycloak"). Only the nidan realm's login surface is served; master, admin, account console and client
# registration stay 404 (KC-07-03): the admin console is reachable only through the SSH tunnel to 127.0.0.1:8180.
# Written empty when central login is off (docker-entrypoint.sh), so :9443 then serves no Keycloak at all.

# Everything under /auth/ not listed below. A plain prefix (not ^~), so the regex below still wins.
location /auth/ {
    return 404;
}

# OIDC endpoints. auth and token are rate-limited per client IP (KC-12-07); logout/logout-confirm is
# Keycloak's own confirmation form.
location ~ ^/auth/realms/nidan/protocol/openid-connect/(auth|token)$ {
    limit_req zone=nidan_kc_oidc burst=9 nodelay;
    include /etc/nginx/auth/keycloak-proxy.conf;
}
location ~ ^/auth/realms/nidan/protocol/openid-connect/(certs|userinfo|login-status-iframe\.html|logout|logout/logout-confirm)$ {
    include /etc/nginx/auth/keycloak-proxy.conf;
}

# Login, OTP and required-action forms
location /auth/realms/nidan/login-actions/ {
    limit_req zone=nidan_kc_actions burst=9 nodelay;
    include /etc/nginx/auth/keycloak-proxy.conf;
}

location = /auth/realms/nidan/.well-known/openid-configuration {
    include /etc/nginx/auth/keycloak-proxy.conf;
}

# Hospital branding for the login theme (logo, colours): the gateway's branding folder, the same files the launcher
# uses (proxy/assets/brand, or NIDAN_BRANDING_DIR mounted over it). The theme only references brand/<file>.
location ~ ^/auth/resources/[^/]+/login/nidan/brand/([A-Za-z0-9_-]+\.(css|svg|png))$ {
    alias /usr/share/nginx/html/assets/brand/$1;
    include /etc/nginx/hsts.conf;            # own add_header below drops the server-level one
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

# Theme assets and keycloak.js
location /auth/resources/ {
    include /etc/nginx/auth/keycloak-proxy.conf;
}
location /auth/js/ {
    include /etc/nginx/auth/keycloak-proxy.conf;
}
