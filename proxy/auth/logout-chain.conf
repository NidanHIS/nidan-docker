# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Logout chain (rule 7): whatever the app's logout redirects to, send the browser to /oauth2/sign_out instead.
# Must come before the location's own proxy_redirect lines (the first match wins).
proxy_redirect ~.* /oauth2/sign_out?rd=/;
