# Central-login snippet (backlog KC-10, spec section 4). docker-entrypoint.sh copies proxy/auth/*.conf to
# /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true and writes them EMPTY otherwise (today's behaviour, KC-10-14).
# Logout chain (rule 7, changed 2026-10-12 by the user): the app ends its own session, then the browser goes to the
# launcher with ?signed_out=<app>. launcher.js signs the person out of everything when that was their only app (a
# one-app launcher would open it again), else keeps the launcher with their other apps and a "sign out of
# everything". $nidan_app is the fixed key the gate snippet set, never from the request.
# Must come before the location's own proxy_redirect lines (the first match wins).
proxy_redirect ~.* /?signed_out=$nidan_app;
