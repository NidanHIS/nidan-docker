# Central-login snippet (backlog KC-10, spec section 4): copied to /etc/nginx/auth/ when NIDAN_SSO_ENABLED=true,
# written EMPTY otherwise (Odoo's own logout redirect then stands). See logout-chain.conf: same rule, but Odoo runs
# on :8069 and the launcher on 443 of the same host.
proxy_redirect ~.* https://$host/?signed_out=odoo;
