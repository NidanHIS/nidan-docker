# Security headers for pages the gateway serves itself (launcher, error pages). Backlog KC-12-01.
# Included per location because nginx drops inherited add_header in any location that sets its own.
# CSP is frame-ancestors only for now: the launcher still uses inline <script>/<style>; the full
# default-src 'self' policy comes with the launcher rebuild (KC-15).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
include /etc/nginx/hsts.conf;          # HSTS only for a public-cert domain (KC-12-02); empty otherwise
