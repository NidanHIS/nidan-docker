<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NidanEHR Services</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px;
        }

        .brand-logo {
            max-width: 300px;
            margin-bottom: 40px;
            height: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .desc {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        /* Footer Styling */
        footer {
            width: 100%;
            background-color: #1a1a1a;
            color: #ccc;
            padding: 20px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .footer-text {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .footer-logo {
            height: 40px;
            /* Adjust based on logo aspect ratio */
            opacity: 0.9;
        }

        /* Mobile adjustment */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <!-- Nidan Logo -->
        <img src="nidan-logo.png" alt="NidanEHR" class="brand-logo">

        <div class="grid">
            <!-- OpenMRS -->
            <a href="/openmrs/" target="_blank" class="card">
                <div class="icon">🏥</div>
                <div class="title">OpenMRS 3.0</div>
                <div class="desc">Electronic Medical Record</div>
            </a>

            <!-- Odoo (Direct Port) -->
            <a href="http://localhost:8069" target="_blank" class="card">
                <div class="icon">📊</div>
                <div class="title">Odoo 19</div>
                <div class="desc">ERP & Inventory</div>
            </a>

            <!-- Orthanc -->
            <a href="/orthanc/app/explorer.html" target="_blank" class="card">
                <div class="icon">🦴</div>
                <div class="title">Orthanc</div>
                <div class="desc">PACS & Imaging</div>
            </a>

            <!-- Keycloak -->
            <a href="/auth/" target="_blank" class="card">
                <div class="icon">🔐</div>
                <div class="title">Keycloak</div>
                <div class="desc">Identity Management</div>
            </a>
        </div>
    </div>

    <!-- Powered by Footer -->
    <footer>
        <span class="footer-text">Powered by</span>
        <img src="trigonal-logo.png" alt="Trigonal Technology" class="footer-logo">
    </footer>
</body>

</html>
