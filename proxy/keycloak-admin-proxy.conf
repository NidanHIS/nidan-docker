# Operator access to the Keycloak admin console (KC-07-04): 127.0.0.1:8180 on the host, reached through an SSH tunnel.
# Keycloak sits on the internal auth-net, where Docker does not serve published ports; this proxy is on auth-net plus
# its own non-internal kc-admin-net (nothing else joins it), so the host port works while no app can reach Keycloak.
# Plain TCP: Keycloak serves the admin console under KC_HOSTNAME_ADMIN=http://127.0.0.1:8180/auth.
worker_processes 1;
error_log stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
stream {
    resolver 127.0.0.11 valid=30s ipv6=off;    # Docker DNS: keycloak may start after this proxy
    server {
        listen 8180;
        set $keycloak keycloak:8080;
        proxy_pass $keycloak;
        proxy_connect_timeout 5s;
    }
}
