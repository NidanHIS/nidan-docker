<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Default sign-in background (Nidan branding folder; replace with a hospital's own background.svg/.jpg).
       Original line art: stethoscope, capsules, tablets, medical crosses, a heartbeat line. The centre stays calm
       so the sign-in card reads first. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#d5e3ea"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#008080" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#008080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#0b5d7a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b5d7a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0b5d7a" fill-opacity="0.07"/>
    </pattern>
    <g id="capsule">
      <rect x="-46" y="-17" width="92" height="34" rx="17"/>
      <line x1="0" y1="-17" x2="0" y2="17"/>
    </g>
    <g id="tablet">
      <circle r="22"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
    <path id="cross" d="M-12-34h24v22h22v24h-22v22h-24v-22h-22v-24h22z"/>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <g fill="none" stroke="#0b6f7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.22">
    <!-- stethoscope, lower left -->
    <path d="M150 360 v120 a90 90 0 0 0 180 0 v-120"/>
    <path d="M150 360 q-6 -26 -30 -26"/>
    <path d="M330 360 q6 -26 30 -26"/>
    <path d="M240 570 v90 q0 130 130 130 h40"/>
    <circle cx="460" cy="790" r="48"/>
    <circle cx="460" cy="790" r="22"/>

    <!-- heartbeat line along the bottom -->
    <path d="M0 900 h520 l30 -60 l40 120 l40 -150 l36 90 h170 l24 -40 l30 70 l26 -30 h684" stroke-opacity="0.16"/>

    <!-- capsules and tablets, upper right -->
    <use href="#capsule" transform="translate(1290 170) rotate(-35)"/>
    <use href="#capsule" transform="translate(1440 300) rotate(20)"/>
    <use href="#capsule" transform="translate(1180 330) rotate(65) scale(0.8)"/>
    <use href="#tablet" transform="translate(1420 130)"/>
    <use href="#tablet" transform="translate(1340 420) scale(0.8)"/>
    <use href="#tablet" transform="translate(1520 470) scale(1.1)"/>

    <!-- medical crosses -->
    <use href="#cross" transform="translate(1440 720) scale(1.3)"/>
    <use href="#cross" transform="translate(120 140) scale(0.9)"/>
    <use href="#cross" transform="translate(1100 880) scale(0.7)"/>

    <!-- a few small capsules near the edges -->
    <use href="#capsule" transform="translate(560 120) rotate(15) scale(0.6)"/>
    <use href="#tablet" transform="translate(70 620) scale(0.7)"/>
  </g>
</svg>
