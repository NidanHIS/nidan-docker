<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No access</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/assets/launcher.css">
  <link rel="stylesheet" href="/assets/brand/brand.css">
</head>
<body>
  <!-- Shown when the gateway refuses an app the person has no role for (backlog KC-16, ds3). -->
  <main>
    <div class="container status-page">
      <header class="header"><img src="/assets/brand/logo.svg" alt="" class="brand-logo"></header>
      <h1 class="hero-title" id="np-title" data-i18n="na.titleGeneric">You don't have access to this application</h1>
      <p id="np-who" hidden></p>
      <p data-i18n="na.askAdmin">If you need it for your work, ask your hospital administrator to add it to your job.</p>
      <p class="status-actions">
        <a href="/?launcher" class="status-button" data-i18n="na.back">Back to your apps</a>
        <a href="/oauth2/sign_out" id="np-switch" class="status-link" hidden>Not you? Sign in as someone else</a>
      </p>
    </div>
  </main>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/status-pages.js" defer></script>
</body>
</html>
