# Odoo pages a payer's phone opens without any hospital session (:8069 server, routes.yaml "payer phone"). They
# check their own link token; no gate, no client identity headers reach Odoo.
set $odoo_backend "odoo:8069";
proxy_pass http://$odoo_backend;
include /etc/nginx/client-identity-headers.conf;
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header Host $host:$server_port;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host:$server_port;
