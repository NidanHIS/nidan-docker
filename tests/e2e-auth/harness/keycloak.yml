# Realm harness (backlog KC-01-01, KC-08-01): the pinned Keycloak (dev mode, in-memory DB, nothing kept) and the
# pinned keycloak-config-cli importing keycloak/realm/** with throwaway secrets. Two imports in a row: the
# second must change nothing.
#
#   docker compose -f tests/e2e-auth/harness/keycloak.yml up -d --wait keycloak
#   docker compose -f tests/e2e-auth/harness/keycloak.yml run --rm config-cli     # twice
name: nidan-realm-harness

x-secret: &secret harness-only-not-a-real-secret-0123456789

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev"]
    environment:
      KC_DB: dev-mem
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: harness-admin-password
    volumes:
      - ../../../keycloak/themes/nidan:/opt/keycloak/themes/nidan:ro
      - ../../../keycloak/providers/dist:/opt/keycloak/providers:ro   # nidan-code-otp: the login flow needs it
      - ../../../keycloak/password-blocklist.txt:/opt/keycloak/data/password-blacklists/nidan.txt:ro
    ports:
      - "127.0.0.1:18180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    profiles: ["import"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_GRANTTYPE: password
      KEYCLOAK_CLIENTID: admin-cli
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: harness-admin-password
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/base/*.yaml,/config/master/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_GROUP: full
      GATEWAY_DOMAIN: nidan.example
      NIDAN_SYNC_USERNAME: nidan-sync
      # export it from scripts/reserved-usernames.py before importing; the default only keeps `stop`/`down` usable
      # (realm.spec's reserved-username test fails loudly when it was not exported)
      KC_USERNAME_PATTERN: '${KC_USERNAME_PATTERN:-^[a-z][a-z0-9._-]{2,39}$}'
      DEFAULT_LOCALE: en
      KC_GATEWAY_CLIENT_SECRET: *secret
      KC_OPENMRS_CLIENT_SECRET: *secret
      KC_ODOO_CLIENT_SECRET: *secret
      KC_DHIS2_CLIENT_SECRET: *secret
      KC_SUPERSET_CLIENT_SECRET: *secret
      KC_OPENELIS_CLIENT_SECRET: *secret
      KC_CIS_CLIENT_SECRET: *secret
      KC_ODOO_SYNC_CLIENT_SECRET: *secret
      KC_PORTAL_SYNC_CLIENT_SECRET: *secret
      KC_CONFIG_CLI_CLIENT_SECRET: *secret
      KC_AUTOMATION_CLIENT_SECRET: *secret
    volumes:
      - ../../../keycloak/realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
