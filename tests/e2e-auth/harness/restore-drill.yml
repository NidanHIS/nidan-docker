# Keycloak restore drill (backlog KC-28-06): Keycloak on the production Postgres image, its database in the named
# volume keycloak-db-data, so scripts/volume-backup.sh backs it up and restores it exactly as on a site.
# Run twice with different project names (scripts/keycloak-restore-drill.sh): A is backed up, B is restored into a
# NEW empty volume, so nothing that exists is overwritten.
services:
  keycloak-db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: drill-db-password-not-real
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: drill-db-password-not-real
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: harness-admin-password
    volumes:
      - ../../../keycloak/themes/nidan:/opt/keycloak/themes/nidan:ro
      - ../../../keycloak/password-blocklist.txt:/opt/keycloak/data/password-blacklists/nidan.txt:ro
    ports:
      - "127.0.0.1:${DRILL_PORT:-18190}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    profiles: ["import"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_GRANTTYPE: password
      KEYCLOAK_CLIENTID: admin-cli
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: harness-admin-password
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/base/*.yaml,/config/master/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_GROUP: full
      GATEWAY_DOMAIN: nidan.example
      NIDAN_SYNC_USERNAME: nidan-sync
      KC_USERNAME_PATTERN: '${KC_USERNAME_PATTERN:-^[a-z][a-z0-9._-]{2,39}$}'
      DEFAULT_LOCALE: en
      KC_GATEWAY_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_OPENMRS_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_ODOO_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_DHIS2_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_SUPERSET_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_OPENELIS_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_CIS_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_ODOO_SYNC_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_PORTAL_SYNC_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_CONFIG_CLI_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
      KC_AUTOMATION_CLIENT_SECRET: harness-only-not-a-real-secret-0123456789
    volumes:
      - ../../../keycloak/realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak-db-data: {}
