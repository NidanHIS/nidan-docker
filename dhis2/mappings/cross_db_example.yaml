# ─────────────────────────────────────────────────────────────────────────────
# Example: Cross-Database Mapping (OpenMRS + OpenELIS via DuckDB)
#
# This program uses source_db: duckdb which activates get_duckdb_connection()
# in engine/source_db.py.  DuckDB attaches OpenMRS (MySQL) and OpenELIS
# (PostgreSQL) as catalogs "openmrs" and "openelis" and pushes the JOIN
# entirely in-process — nothing is materialised in Python.
#
# Required env vars:
#   OPENMRS_DB_URL  = mysql+pymysql://openmrs:openmrs@localhost:3306/openmrs
#   OPENELIS_DB_URL = postgresql://clinlims:clinlims@localhost:5432/clinlims
#
# DHIS2 dataset:   Lab-OPD Integrated Summary (REPLACE with real UID)
# DHIS2 org unit:  Achham District Hospital   (REPLACE with real UID)
# ─────────────────────────────────────────────────────────────────────────────

dataset_id:   "REPLACE_WITH_REAL_DATASET_UID"
dataset_name: "Lab-OPD Integrated Summary"
org_unit_id:  "REPLACE_WITH_REAL_ORG_UNIT_UID"

# ── source_db: duckdb activates the cross-DB path ────────────────────────────
source_db:   duckdb

period_type:  Monthly
sync_schedule: monthly

targets:
  - federal_hmis          # connection IDs from connections/*.yaml

queries:
  # ──────────────────────────────────────────────────────────────────────────
  # Query 1: Integrated lab-confirmed OPD counts
  #   Joins confirmed diagnosis from OpenMRS encounters with the corresponding
  #   lab result from OpenELIS (matched by patient national ID).
  #   SQL params available: :start_date  :end_date
  # ──────────────────────────────────────────────────────────────────────────
  - name:     "lab_confirmed_opd"
    sql_file: "sql/cross_db_example/lab_confirmed_opd.sql"
    optional: false
    mappings:
      # ── Total OPD visits with lab confirmation ──────────────────────────
      - key: "total_opd_lab_confirmed"
        dataElement:             "REPLACE_DE_UID_TOTAL"
        dataElementName:         "OPD Visits - Lab Confirmed"
        categoryOptionCombo:     "HllvX50cXC0"   # default
        categoryOptionComboName: "default"

      # ── Lab-confirmed malaria (disaggregated) ────────────────────────────
      - key: "malaria_lab_confirmed_male"
        dataElement:             "REPLACE_DE_UID_MALARIA"
        dataElementName:         "Malaria - Lab Confirmed"
        categoryOptionCombo:     "REPLACE_COC_UID_MALE"
        categoryOptionComboName: "Male"

      - key: "malaria_lab_confirmed_female"
        dataElement:             "REPLACE_DE_UID_MALARIA"
        dataElementName:         "Malaria - Lab Confirmed"
        categoryOptionCombo:     "REPLACE_COC_UID_FEMALE"
        categoryOptionComboName: "Female"

      # ── Lab-confirmed tuberculosis ────────────────────────────────────────
      - key: "tb_lab_confirmed"
        dataElement:             "REPLACE_DE_UID_TB"
        dataElementName:         "Tuberculosis - Lab Confirmed"
        categoryOptionCombo:     "HllvX50cXC0"
        categoryOptionComboName: "default"

  # ──────────────────────────────────────────────────────────────────────────
  # Query 2: Pending lab orders (from OpenELIS) not yet returned
  #   Single-DB query but kept in same file for the same submission period.
  # ──────────────────────────────────────────────────────────────────────────
  - name:     "pending_lab_orders"
    sql_file: "sql/cross_db_example/pending_lab_orders.sql"
    optional: true            # won't abort on missing SQL
    mappings:
      - key: "pending_lab_tests"
        dataElement:             "REPLACE_DE_UID_PENDING"
        dataElementName:         "Lab Tests Pending"
        categoryOptionCombo:     "HllvX50cXC0"
        categoryOptionComboName: "default"

validation:
  abort_on_invalid_ids: true
  warn_on_empty_result:  true
  dry_run:               false

audit:
  enabled:        true
  directory:      "./audit_logs"
  retention_days: 365
