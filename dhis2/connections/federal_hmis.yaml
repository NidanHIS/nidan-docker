# ID and label used in the UI (seeded into DB on startup)
id: federal_hmis
label: "Federal HMIS Nepal (HMIS 2.0)"
is_active: true
adapter_type: dhis2

# Environment-variable NAMES (not the values themselves — secrets stay in .env)
url_env: FEDERAL_HMIS_URL
username_env: FEDERAL_HMIS_USERNAME
password_env: FEDERAL_HMIS_PASSWORD
org_unit_id_env: FEDERAL_HMIS_ORG_UNIT

ssl_verify: false          # Federal HMIS uses a self-signed cert
api_version: "2.39"        # DHIS2 API version
