server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve index.html for all non-static file requests (SPA support)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend if running in standalone mode (optional)
    # In the full compose, the main gateway handles this.
}
