server {
    listen 443 ssl default;
    listen [::]:443 ssl;
    server_name openelis.localhost;

    ssl_certificate    /etc/nginx/certs/apache-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/apache-selfsigned.key;

    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    absolute_redirect off;

    location / {
        proxy_pass http://frontend.openelis.org;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass https://oe.openelis.org:8443/api/;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}


