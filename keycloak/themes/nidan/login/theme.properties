# Nidan login theme (backlog KC-17, spec 8.3 / design 12A). Inherits keycloak.v2 and overrides messages, one
# stylesheet and one template: login.ftl, copied from Keycloak's and changed only so a disabled account with the right
# password reads like any failed login (KC-17-02). No ?no_esc anywhere; check-theme.py pins the copy to the compose
# Keycloak version (KC-17-06).
# styles must repeat the parent's list: keycloak.v2 26.8 has styles=css/styles.css (checked in the 26.8.0 jar).
parent=keycloak.v2
import=common/keycloak
# brand/brand.css (colours) and brand/logo.svg are served by the gateway from its branding folder (shared with the
# launcher, proxy/assets/brand/README.md); Keycloak itself has no brand/ folder.
styles=css/styles.css brand/brand.css css/nidan.css
locales=en,ne,es,fr,ar
# keycloak.v2 follows the browser's dark mode (pf-v5-theme-dark); the Nidan look is light only, and with dark on the
# card turned dark under the light brand text (unreadable labels, reported 2026-10-12)
darkMode=false
