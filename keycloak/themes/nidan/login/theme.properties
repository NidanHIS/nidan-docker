# Nidan login theme (backlog KC-17, spec 8.3 / design 12A). Inherits keycloak.v2 and overrides only
# messages and one stylesheet: no .ftl overrides, so Keycloak's own escaping applies (KC-17-06).
# styles must repeat the parent's list: keycloak.v2 26.8 has styles=css/styles.css (checked in the 26.8.0 jar).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/nidan.css
locales=en,ne
