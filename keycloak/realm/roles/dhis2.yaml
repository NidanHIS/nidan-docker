# dhis2 roles Keycloak may grant (backlog KC-24, R1). Generated by scripts/check-catalog.py --write,
# then reviewed. superuser roles may only be mapped by the operator-managed app-superusers group (KC-57).
app: dhis2
roles:
- name: admin
  source: core
  superuser: true
- name: report-admin
  source: core
  superuser: true
- name: report-user
  source: core
  superuser: false
- name: reporter
  source: core
  superuser: false
