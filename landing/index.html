<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nidan HIS Launcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        color: #1f2937;
      }
      main {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
        padding: 48px;
        max-width: 520px;
        width: 90%;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 8px;
      }
      p {
        margin-bottom: 32px;
        color: #4b5563;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 16px;
      }
      a {
        display: block;
        padding: 16px;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
      }
      small {
        display: block;
        margin-top: 32px;
        color: #6b7280;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nidan HIS</h1>
      <p>Choose an application to launch:</p>
      <ul>
        <li><a href="http://localhost/openmrs/spa">OpenMRS</a></li>
        <li><a href="https://openlis.localhost">OpenELIS</a></li>
        <li><a href="http://localhost:8069">Odoo</a></li>
      </ul>
      <small>All services are proxied through Traefik on localhost.</small>
    </main>
  </body>
</html>
