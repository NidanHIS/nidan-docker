server {
    listen 80;
    server_name localhost;

    # Serve React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Backend
    location /api/OpenELIS-Global/ {
        # Rewrite to remove /api prefix as backend expects /OpenELIS-Global/
        rewrite ^/api/OpenELIS-Global/(.*)$ /OpenELIS-Global/$1 break;
        
        proxy_pass http://openelis:8080;
        
        # Rewrite cookie path so browser sends it back to /api/...
        proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
