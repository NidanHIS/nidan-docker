worker_processes  1;

events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/mime.types;

    upstream openelis_backend {
        server openelis:8080;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/${OPENELIS_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${OPENELIS_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://openelis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


